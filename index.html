<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MH Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0a0a;
    color: #f0f0f0;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    justify-content: center;
    padding: 60px 20px;
  }

  .wrap { width: 100%; max-width: 1240px; }

  #cards, #cards-data, #cards-tasks {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 1080px) {
    #cards, #cards-data, #cards-tasks { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 720px) {
    #cards, #cards-data, #cards-tasks { grid-template-columns: 1fr; }
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #ff6b35, #f7c59f);
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }

  .header-text h1 { font-size: 18px; font-weight: 600; color: #fff; letter-spacing: -0.3px; }
  .header-text p { font-size: 10px; color: #555; font-family: 'DM Mono', monospace; letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

  .tool-card {
    background: #141414;
    border: 1px solid #1e1e1e;
    border-radius: 12px;
    padding: 20px 22px;
  }

  .tool-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .tool-name { font-size: 15px; font-weight: 600; color: #fff; }
  .tool-desc { font-size: 11px; color: #555; line-height: 1.6; margin-bottom: 14px; }

  .tool-actions { display: flex; gap: 10px; }

  .icon-btn {
    background: transparent;
    border: none;
    color: #444;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: color 0.2s;
    padding: 0;
  }
  .icon-btn:hover { color: #ff6b35; }

  .status-line {
    margin-top: 10px;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: #555;
    min-height: 14px;
    display: flex; align-items: center; gap: 6px;
  }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #333; flex-shrink: 0; }
  .status-dot.success { background: #4ade80; }
  .status-dot.error { background: #f87171; }
  .status-line.success { color: #4ade80; }
  .status-line.error { color: #f87171; }

  .frame-wrap {
    margin-top: 14px;
    border: 1px solid #1e1e1e;
    border-radius: 10px;
    overflow: hidden;
    background: #0f0f0f;
    display: none;
  }
  .frame-wrap.visible { display: block; }

  .tool-frame {
    width: 100%;
    border: none;
    display: block;
  }

  .config-toggle {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: #444;
    cursor: pointer;
    margin-top: 12px;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .config-toggle:hover { color: #777; }

  .config-panel {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #1e1e1e;
  }
  .config-panel.open { display: block; }

  .config-hint { font-size: 10px; color: #444; line-height: 1.6; margin-bottom: 10px; }
  .config-hint b { color: #ff6b35; }

  .id-row { display: flex; gap: 8px; }

  input {
    flex: 1;
    padding: 8px 11px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: #f0f0f0;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus { border-color: #ff6b35; }
  input::placeholder { color: #333; }

  select {
    padding: 8px 11px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: #f0f0f0;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    outline: none;
  }
  select:focus { border-color: #ff6b35; }

  /* Quick-add bar — modeled on Microsoft To Do's "+ task" row: a plain
     inline input (no boxed border look) with icon-only actions on the
     right, each opening a small dropdown menu instead of a full-width
     select/date field. */
  .qa-bar {
    display: flex; align-items: center; gap: 10px;
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 8px 12px;
  }
  .qa-plus {
    flex: none; width: 20px; height: 20px; border-radius: 50%;
    border: none; background: #2a2a2a; color: #ccc;
    font-size: 14px; line-height: 1; cursor: pointer;
    display: grid; place-content: center;
  }
  .qa-plus:hover { background: #ff6b35; color: #fff; }
  .qa-input {
    flex: 1; background: transparent; border: none; padding: 0;
    font-family: 'DM Sans', sans-serif; font-size: 13px; color: #f0f0f0;
  }
  .qa-input:focus { border: none; }
  .qa-icons { display: flex; gap: 4px; flex: none; }
  .qa-icon-btn {
    background: none; border: none; cursor: pointer; font-size: 14px;
    padding: 4px 6px; border-radius: 6px; opacity: 0.7; transition: all 0.15s;
  }
  .qa-icon-btn:hover, .qa-icon-btn.active { opacity: 1; background: #2a2a2a; }
  .qa-menu {
    position: relative; margin-top: 4px; background: #1e1e1e; border: 1px solid #2a2a2a;
    border-radius: 8px; padding: 4px; display: flex; flex-direction: column;
    max-width: 260px;
  }
  /* Without this, the class rule's display:flex above always beats the
     browser's default [hidden]{display:none} at equal specificity — the
     two menus stayed permanently visible together, toggling `hidden` did
     nothing (confirmed by screenshot). */
  .qa-menu[hidden] { display: none; }
  .qa-menu-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: none; border: none; text-align: left; cursor: pointer;
    padding: 7px 10px; border-radius: 6px; font-size: 12px; color: #f0f0f0;
    font-family: 'DM Sans', sans-serif;
  }
  .qa-menu-item:hover { background: #2a2a2a; }
  .qa-menu-item .qa-menu-day { color: #888; font-size: 11px; }
  .qa-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .qa-chip {
    display: flex; align-items: center; gap: 5px; font-size: 10px;
    background: #1e1e1e; border: 1px solid #2a2a2a; border-radius: 999px;
    padding: 3px 9px; color: #ccc;
  }
  .qa-chip button { background: none; border: none; color: #666; cursor: pointer; font-size: 11px; padding: 0; }
  .qa-chip button:hover { color: #f87171; }
  .task-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid #1e1e1e; border-radius: 6px; transition: background 0.15s; }
  .task-row:last-child { border-bottom: none; }
  .task-row:hover { background: #161616; }

  /* Todoist-style round checkbox — color-coded by priority when open,
     fills solid with a checkmark once done, regardless of priority.
     padding/margin explicitly zeroed: the global `input` rule's
     padding:8px 11px otherwise distorts an appearance:none checkbox into
     an oval instead of a circle (confirmed on Safari/mobile). */
  .task-row input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    width: 15px; height: 15px; flex: none;
    padding: 0; margin: 0;
    box-sizing: border-box;
    border-radius: 50%;
    border: 2px solid var(--task-priority-color, #444);
    background: transparent;
    cursor: pointer;
    position: relative;
    display: inline-grid; place-content: center;
    transition: all 0.15s;
  }
  .task-row input[type="checkbox"]:hover { border-color: #ff6b35; box-shadow: 0 0 0 3px rgba(255,107,53,0.15); }
  .task-row input[type="checkbox"]:checked {
    background: #ff6b35; border-color: #ff6b35;
  }
  .task-row input[type="checkbox"]:checked::after {
    content: '✓';
    color: #0a0a0a; font-size: 9px; font-weight: 700; line-height: 1;
  }

  .task-text { flex: 1; font-size: 12px; color: #f0f0f0; cursor: pointer; }
  .task-text.done { color: #555; text-decoration: line-through; }
  .task-row .task-del { opacity: 0; transition: opacity 0.15s; }
  .task-row:hover .task-del { opacity: 1; }
  .task-del { background: none; border: none; color: #555; cursor: pointer; font-size: 13px; padding: 2px 6px; flex: none; }
  .task-del:hover { color: #f87171; }

  .goal-group-label { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px; padding-left: 8px; border-left: 3px solid #444; }
  .goal-group-label:first-child { margin-top: 0; }
  .goal-group-label.tf-0 { border-left-color: #5b9bd5; }
  .goal-group-label.tf-1 { border-left-color: #6fb37a; }
  .goal-group-label.tf-2 { border-left-color: #f5a524; }
  .goal-group-label.tf-3 { border-left-color: #c77adf; }

  .task-card-accent { border-top: 3px solid var(--task-accent-color, #ff6b35); }
  .goal-status {
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif; text-transform: uppercase; letter-spacing: 0.3px; flex: none;
  }
  .goal-status.not_started { background: #2a2a2a; color: #999; }
  .goal-status.in_progress { background: #3a2a10; color: #f5a524; }
  .goal-status.done { background: #10301c; color: #4ade80; }

  .save-btn {
    padding: 8px 14px;
    background: #1e1e1e;
    border: 1px solid #2a2a2a;
    border-radius: 6px;
    color: #ccc;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .save-btn:hover { border-color: #ff6b35; color: #ff6b35; }

  /* Order Tracker (native) */
  .ot-tabs { display: flex; gap: 4px; background: #1a1a1a; border-radius: 8px; padding: 3px; margin: 12px 0; }
  .ot-tab-btn {
    flex: 1; padding: 6px 0; background: transparent; border: none; border-radius: 6px;
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; color: #666; cursor: pointer; transition: all 0.15s;
  }
  .ot-tab-btn.active { background: #ff6b35; color: #fff; }

  .ot-stats { display: flex; flex-direction: column; gap: 6px; }

  .ot-col-hd { display: flex; justify-content: flex-end; gap: 10px; padding: 0 12px 2px; }
  .ot-col-hd span { width: 52px; text-align: right; font-size: 8px; font-family: 'DM Mono', monospace; color: #555; letter-spacing: 0.5px; text-transform: uppercase; }

  .ot-row {
    background: #1a1a1a; border-radius: 8px; padding: 9px 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .ot-row.highlight { background: linear-gradient(135deg, #ff6b35, #e85d25); }
  .ot-label { font-size: 11px; font-weight: 600; color: #ccc; }
  .ot-sub { font-size: 9px; color: #555; margin-top: 2px; font-family: 'DM Mono', monospace; }
  .ot-row.highlight .ot-label, .ot-row.highlight .ot-sub { color: rgba(255,255,255,0.85); }
  .ot-divider { height: 1px; background: #222; margin: 2px 0; }

  .ot-values { display: flex; gap: 10px; flex-shrink: 0; }
  .ot-value { width: 52px; font-size: 13px; font-weight: 700; color: #fff; text-align: right; }

  .ot-monthly { display: none; flex-direction: column; gap: 5px; max-height: 380px; overflow-y: auto; }
  .ot-monthly.visible { display: flex; }
  .ot-stats.hidden { display: none; }
  .month-row { background: #1a1a1a; border-radius: 7px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
  .month-row.current { background: #2a1a10; border: 1px solid #ff6b3555; }
  .month-name { font-size: 10px; font-weight: 600; color: #888; width: 50px; flex-shrink: 0; font-family: 'DM Mono', monospace; }
  .month-row.current .month-name { color: #ff6b35; }
  .month-bar-track { flex: 1; height: 5px; background: #222; border-radius: 3px; overflow: hidden; }
  .month-bar-fill { height: 100%; background: #ff6b35; border-radius: 3px; min-width: 2px; }
  .month-values { display: flex; gap: 10px; flex-shrink: 0; }
  .month-value { font-size: 10px; font-weight: 700; color: #fff; text-align: right; width: 52px; }

  .ot-updated { font-size: 9px; color: #444; font-family: 'DM Mono', monospace; text-align: center; margin-top: 10px; }

  .proof-summary { font-size: 10px; color: #555; font-family: 'DM Mono', monospace; margin: 4px 0 10px; }
  .proof-results { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
  .proof-item { background: #1a1a1a; border-radius: 8px; padding: 10px 12px; border: 1px solid #2a1414; }
  .proof-item.balance-match { border-color: #fbbf24; background: #2a2410; box-shadow: 0 0 0 1px #fbbf24; }
  .proof-name { font-size: 11px; font-weight: 600; color: #fff; }
  .proof-name span { color: #555; font-weight: 400; }
  .proof-diff { font-size: 10px; color: #f87171; margin-top: 4px; font-family: 'DM Mono', monospace; }
  .proof-link { font-size: 9px; color: #ff6b35; text-decoration: none; margin-top: 6px; display: inline-block; }
  .proof-link:hover { text-decoration: underline; }

  .no-wrap { max-height: 460px; overflow: auto; margin-top: 4px; }
  .no-table { width: 100%; border-collapse: collapse; font-size: 10px; }
  .no-table th {
    position: sticky; top: 0; background: #1a1a1a; color: #666; text-align: left;
    font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 6px 8px; border-bottom: 1px solid #2a2a2a; white-space: nowrap;
  }
  .no-table td { padding: 6px 8px; border-bottom: 1px solid #1e1e1e; color: #ccc; vertical-align: middle; }
  .no-table tr:hover td { background: #1a1a1a; }
  .no-table td.no-name { font-weight: 600; color: #fff; white-space: nowrap; }
  .no-table td.no-num { text-align: right; white-space: nowrap; font-family: 'DM Mono', monospace; }
  .no-table td.no-check { text-align: center; }
  .no-table input[type="checkbox"] { width: 15px; height: 15px; accent-color: #ff6b35; cursor: pointer; }
  .no-table a.proof-link { margin: 0; }
  .inv-status-chip {
    display: inline-block; padding: 3px 9px; border-radius: 20px; white-space: nowrap;
    background: #1e2a1e; color: #9fd89f; font-size: 9px; font-family: 'DM Mono', monospace;
  }

  .page-tabs { display: flex; gap: 4px; background: #141414; border: 1px solid #1e1e1e; border-radius: 10px; padding: 4px; margin-bottom: 20px; width: fit-content; }
  .page-tab-btn {
    padding: 8px 22px; background: transparent; border: none; border-radius: 7px;
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; color: #666; cursor: pointer; transition: all 0.15s;
  }
  .page-tab-btn.active { background: #ff6b35; color: #fff; }
  .page-panel { display: none; }
  .page-panel.active { display: block; }
  .assign-frame {
    width: 100%; height: calc(100vh - 160px); min-height: 600px;
    border: 1px solid #1e1e1e; border-radius: 12px; background: #fff;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo-icon">🚀</div>
    <div class="header-text">
      <h1>MH Dashboard</h1>
      <p>Extension launcher</p>
    </div>
  </div>

  <div class="page-tabs">
    <button class="page-tab-btn active" data-page="operations">Operations</button>
    <button class="page-tab-btn" data-page="data">Data</button>
    <button class="page-tab-btn" data-page="assign">Assign</button>
    <button class="page-tab-btn" data-page="tasks">Tasks</button>
  </div>

  <div id="page-operations" class="page-panel active"><div id="cards"></div></div>
  <div id="page-data" class="page-panel"><div id="cards-data"></div></div>
  <div id="page-assign" class="page-panel">
    <iframe src="https://mhcreatives.github.io/mh-assign-dasboard/" class="assign-frame" title="Assign Dashboard"></iframe>
  </div>
  <div id="page-tasks" class="page-panel"><div id="cards-tasks"></div></div>

</div>

<script>
  const ACTIVE_TAB_STORAGE = 'mh_active_page_tab';

  function activatePageTab(page) {
    const btn = document.querySelector(`.page-tab-btn[data-page="${page}"]`);
    const panel = document.getElementById(`page-${page}`);
    if (!btn || !panel) return false;
    document.querySelectorAll('.page-tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    panel.classList.add('active');
    localStorage.setItem(ACTIVE_TAB_STORAGE, page);
    return true;
  }

  document.querySelectorAll('.page-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => activatePageTab(btn.dataset.page));
  });

  const savedTab = localStorage.getItem(ACTIVE_TAB_STORAGE);
  if (savedTab) activatePageTab(savedTab);

  const cardsRoot = document.getElementById('cards');
  const cardsDataRoot = document.getElementById('cards-data');
  const cardsTasksRoot = document.getElementById('cards-tasks');

  const PROOF_EXT_ID_STORAGE = 'mh_ext_id_proof';

  // ─── Order Tracker (native — ported directly, no extension needed) ─────────
  // Invitation totals + Souvenir totals shown side by side per bucket.

  const OT_BASE_ID = 'appo9wxYM4FruiIBA';

  const INV_TABLE = 'tblYa1m1b8ru4vOh9';
  const INV_STATUS = 'fldCmhug64G5pUcFA';
  const INV_TOTAL = 'fldYLks2dxPjb43X2';
  const INV_DATE_SHIPPED = 'fldNPAxYpiX2voBTW';
  const INV_QUOTA = 'fldYuBYEi82bNzyB7';
  const INV_ASSIGNEE = 'fldhul0vE8f1uQlrT';
  const INV_SOUVENIR_TOTAL = 'fldd2HSPwFB7tzyVT';
  const INV_LAYOUT_FINALIZED = 'fldGfqub3TKd2JySk';
  const INV_BREAKDOWN = 'fldD5usNmFvz8uc0z';
  const INV_TYPE = 'fldedGCB6gf73O7ir';
  const INV_TOTAL_SETS = 'fldP43SyOACXa2igm';
  const INV_SIZE = 'fldEzljnIJLXsnG9D';
  const INV_COLOR = 'fldw60O6okJt3FesQ';
  const INV_ENVELOPE_STOCK = 'fld07AADD4qo7duZb';
  const INVENTORY_VIEW_ID = 'viwvtyZBajTTobJO6';
  // Airtable field literally named "Total" — Own Total + Souvenir total +
  // Additional Orders Total. Distinct from INV_TOTAL, which is "Own Total"
  // only (invitation line items, excludes souvenirs/additional orders).
  const INV_GRAND_TOTAL = 'fldFuQ0qYKiXDIker';

  const SOU_TABLE = 'tblXtn5j4tMaL9Tax';
  const SOU_STATUS = 'fldhozzU0CbMQTnnq';
  const SOU_TOTAL = 'fldd6sDmRz4I6g8Vt';
  const SOU_DATE_SHIPPED = 'fldqUDCjBPp5Rii9r';
  const SOU_INV_LINK = 'fld01NmCcAHEdlhMD';
  const SOU_FB_NAME = 'fldthHOJea7EpbNMO';

  const OT_KEY_STORAGE = 'mh_order_tracker_api_key';

  function otGetWeekBounds(offset = 0) {
    const now = new Date();
    const day = now.getDay();
    const offsetToMonday = day === 0 ? -6 : 1 - day;
    const monday = new Date(now);
    monday.setDate(now.getDate() + offsetToMonday + offset * 7);
    monday.setHours(0, 0, 0, 0);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23, 59, 59, 999);
    return { monday, sunday };
  }
  function otIsInWeekBounds(dateStr, bounds) {
    if (!dateStr) return false;
    const d = new Date(dateStr);
    if (isNaN(d)) return false;
    return d >= bounds.monday && d <= bounds.sunday;
  }
  function otIsInCurrentWeek(dateStr) { return otIsInWeekBounds(dateStr, otGetWeekBounds(0)); }
  function otFormatWeekLabel() {
    const { monday, sunday } = otGetWeekBounds();
    const fmt = d => d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
    return `Week of ${fmt(monday)} – ${fmt(sunday)}`;
  }
  function otFormatPeso(val) {
    const num = typeof val === 'number' ? val : parseFloat(val) || 0;
    return '₱' + num.toLocaleString('en-PH', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  }

  async function otFetchRecords(apiKey, tableId, statusField, totalField, dateField, filterFormula, extraFields, viewId, onProgress) {
    const records = [];
    let offset = null;
    let pages = 0;
    const MAX_PAGES = 100; // safety valve: 10,000 records — a runaway loop should never legitimately need more
    do {
      const fieldParams = [statusField, totalField, dateField, ...(extraFields || [])]
        .map(f => `fields%5B%5D=${f}`).join('&');
      const filterPart = filterFormula ? `&filterByFormula=${encodeURIComponent(filterFormula)}` : '';
      const viewPart = viewId ? `&view=${encodeURIComponent(viewId)}` : '';
      let url = `https://api.airtable.com/v0/${OT_BASE_ID}/${tableId}?pageSize=100&returnFieldsByFieldId=true&${fieldParams}${filterPart}${viewPart}`;
      if (offset) url += `&offset=${encodeURIComponent(offset)}`;
      const resp = await fetch(url, { headers: { Authorization: `Bearer ${apiKey}` } });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err?.error?.message || `HTTP ${resp.status}`);
      }
      const data = await resp.json();
      records.push(...(data.records || []));
      offset = data.offset || null;
      pages++;
      if (onProgress) onProgress(records.length);
      if (pages >= MAX_PAGES) break;
    } while (offset);
    return records;
  }

  async function otPatchRecords(apiKey, tableId, updates) {
    for (let i = 0; i < updates.length; i += 10) {
      const batch = updates.slice(i, i + 10);
      const resp = await fetch(`https://api.airtable.com/v0/${OT_BASE_ID}/${tableId}`, {
        method: 'PATCH',
        headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ records: batch }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err?.error?.message || `HTTP ${resp.status}`);
      }
    }
  }

  function otSumTotals(records, totalField) {
    return records.reduce((sum, r) => {
      const val = r.fields?.[totalField];
      return sum + (typeof val === 'number' ? val : parseFloat(val) || 0);
    }, 0);
  }

  function otBuildMonthRange(oldestDate) {
    const months = [];
    const now = new Date();
    const start = new Date(oldestDate.getFullYear(), oldestDate.getMonth(), 1);
    let cur = new Date(now.getFullYear(), now.getMonth(), 1);
    while (cur >= start) {
      months.push({
        key: `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}`,
        label: cur.toLocaleDateString('en-PH', { month: 'short', year: 'numeric' }),
        isCurrent: cur.getFullYear() === now.getFullYear() && cur.getMonth() === now.getMonth()
      });
      cur.setMonth(cur.getMonth() - 1);
    }
    return months;
  }

  // Fetches ALL records (no status filter) from both tables and returns, per month,
  // Invitation + Souvenir totals side by side — plus previous/current-week totals.
  // Souvenir has no "For posting" status, so its "shipped" figures use Date Shipped
  // falling in the week/month, regardless of status (best available proxy).
  async function otFetchCombinedTimeline(apiKey) {
    const [invRecords, souRecords] = await Promise.all([
      otFetchRecords(apiKey, INV_TABLE, INV_STATUS, INV_TOTAL, INV_DATE_SHIPPED, null, [INV_LAYOUT_FINALIZED]),
      otFetchRecords(apiKey, SOU_TABLE, SOU_STATUS, SOU_TOTAL, SOU_DATE_SHIPPED, null),
    ]);

    let oldest = new Date();
    const scanOldest = (records, dateField) => {
      for (const r of records) {
        const d = new Date(r.fields?.[dateField]);
        if (!isNaN(d) && d < oldest) oldest = d;
      }
    };
    scanOldest(invRecords, INV_DATE_SHIPPED);
    scanOldest(souRecords, SOU_DATE_SHIPPED);
    scanOldest(invRecords, INV_LAYOUT_FINALIZED);

    const months = otBuildMonthRange(oldest);
    const totalsInv = {}, totalsSou = {}, totalsLayout = {};
    months.forEach(m => { totalsInv[m.key] = 0; totalsSou[m.key] = 0; totalsLayout[m.key] = 0; });

    const prevBounds = otGetWeekBounds(-1);
    const curBounds = otGetWeekBounds(0);
    let prevWeekInv = 0, prevWeekSou = 0, curWeekSou = 0;

    const accumulate = (records, dateField, totalField, totalsMap, onPrevWeek, onCurWeek) => {
      for (const r of records) {
        const dateStr = r.fields?.[dateField];
        const d = new Date(dateStr);
        if (isNaN(d)) continue;
        const val = r.fields?.[totalField];
        const amount = typeof val === 'number' ? val : parseFloat(val) || 0;
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        if (key in totalsMap) totalsMap[key] += amount;
        if (otIsInWeekBounds(dateStr, prevBounds) && onPrevWeek) onPrevWeek(amount);
        if (otIsInWeekBounds(dateStr, curBounds) && onCurWeek) onCurWeek(amount);
      }
    };
    accumulate(invRecords, INV_DATE_SHIPPED, INV_TOTAL, totalsInv, a => prevWeekInv += a, null);
    accumulate(souRecords, SOU_DATE_SHIPPED, SOU_TOTAL, totalsSou, a => prevWeekSou += a, a => curWeekSou += a);

    // Layout: Invitation records with Status = Done, summed on Own Total, grouped by Layout finalized date
    const doneInvRecords = invRecords.filter(r => r.fields?.[INV_STATUS] === 'Done');
    accumulate(doneInvRecords, INV_LAYOUT_FINALIZED, INV_TOTAL, totalsLayout, null, null);

    return {
      months: months.map(m => ({ ...m, totalInv: totalsInv[m.key], totalSou: totalsSou[m.key], totalLayout: totalsLayout[m.key] })),
      prevWeekInv, prevWeekSou, curWeekSou,
    };
  }

    async function loadData() {
      const apiKey = getKey();
      if (!apiKey) {
        setStatus('Set Airtable API key first ↓', 'error');
        configPanel.classList.add('open');
        bodyEl.style.display = 'none';
        return;
      }

      bodyEl.style.display = '';
      setStatus('Loading...', '');

      try {
        const invEq = s => `{Status}="${s}"`;
        const souEq = s => `{Status}="${s}"`;
        const invF = (filter) => otFetchRecords(apiKey, INV_TABLE, INV_STATUS, INV_TOTAL, INV_DATE_SHIPPED, filter, [INV_QUOTA, INV_ASSIGNEE, INV_SOUVENIR_TOTAL]);
        const souF = (filter) => otFetchRecords(apiKey, SOU_TABLE, SOU_STATUS, SOU_TOTAL, SOU_DATE_SHIPPED, filter);

        const invStatusOr = (...names) => `OR(${names.map(n => `{Status}="${n}"`).join(',')})`;
        const souStatusOr = (...names) => `OR(${names.map(n => `{Status}="${n}"`).join(',')})`;

        const [
          printingRecords, assignedAssemblyRecords, invOrderDoneCandidates,
          souPrinting, souAssignedAssembly, souOrderDoneCandidates,
          timeline
        ] = await Promise.all([
          invF(`AND({Quota}=1,{Assignee for assembly}="",${invStatusOr('To print','Sample print','Printing','Liner to print','Vellum to print','Seal to print','Tag to print','Envelope to print','Wax seal to do','To assemble')})`),
          invF(`AND({Assignee for assembly}!="",${invStatusOr('To print','Sample print','Printing','Liner to print','Vellum to print','Seal to print','Tag to print','Envelope to print','Wax seal to do','To assemble')})`),
          invF(invStatusOr('Photo', 'For packaging', 'To Ship', 'For posting')),
          souF(souEq('Printing')),
          souF(souEq('To assemble')),
          souF(souStatusOr('Photo', 'For packaging', 'To Ship', 'For posting')),
          otFetchCombinedTimeline(apiKey),
        ]);

        // ── Invitation side ──────────────────────────────────────────────────
        const invOrderDoneEligible = invOrderDoneCandidates.filter(r =>
          r.fields?.[INV_STATUS] === 'For posting' ? otIsInCurrentWeek(r.fields?.[INV_DATE_SHIPPED]) : true
        );
        const invPrinting = otSumTotals(printingRecords, INV_TOTAL);
        const invAssemble = otSumTotals(assignedAssemblyRecords, INV_TOTAL);
        const invOrderDone = otSumTotals(invOrderDoneEligible, INV_TOTAL);

        // ── Souvenir side ────────────────────────────────────────────────────
        // If the linked Invitation is in the printing/assembly queue (Quota
        // checked or has an assignee), its linked souvenir's total counts in
        // that same bucket here too — a bundled souvenir should track its
        // parent invitation's production stage, not just its own Status field
        // (which may not have been updated to match yet).
        const souOrderDoneEligible = souOrderDoneCandidates.filter(r =>
          r.fields?.[SOU_STATUS] === 'For posting' ? otIsInCurrentWeek(r.fields?.[SOU_DATE_SHIPPED]) : true
        );
        const souPrintingTotal = otSumTotals(souPrinting, SOU_TOTAL) + otSumTotals(printingRecords, INV_SOUVENIR_TOTAL);
        const souAssembleTotal = otSumTotals(souAssignedAssembly, SOU_TOTAL) + otSumTotals(assignedAssemblyRecords, INV_SOUVENIR_TOTAL);
        const souOrderDone = otSumTotals(souOrderDoneEligible, SOU_TOTAL);

        renderSnapshot(
          { printing: invPrinting, assemble: invAssemble,
            orderdone: invOrderDone,
            prevweek: timeline.prevWeekInv },
          { printing: souPrintingTotal, assemble: souAssembleTotal,
            orderdone: souOrderDone,
            prevweek: timeline.prevWeekSou }
        );
        renderMonthly(timeline.months);
        setStatus('Loaded ✓', 'success');
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    async function cleanupSouvenirRecords() {
      const apiKey = getKey();
      if (!apiKey) {
        setStatus('Set Airtable API key first ↓', 'error');
        configPanel.classList.add('open');
        return;
      }

      setStatus('Scanning souvenir records...', '');

      try {
        const forPostingInv = await otFetchRecords(apiKey, INV_TABLE, INV_STATUS, INV_TOTAL, INV_DATE_SHIPPED, `{Status}="For posting"`);
        const invDateMap = {};
        forPostingInv.forEach(r => { invDateMap[r.id] = r.fields?.[INV_DATE_SHIPPED]; });

        const souRecords = await otFetchRecords(apiKey, SOU_TABLE, SOU_STATUS, SOU_TOTAL, SOU_DATE_SHIPPED, null, [SOU_INV_LINK]);

        const updates = [];
        souRecords.forEach(r => {
          const links = r.fields?.[SOU_INV_LINK];
          if (!Array.isArray(links) || links.length === 0) return;
          const matchedInvId = links.find(id => id in invDateMap);
          if (!matchedInvId) return;
          const shippedDate = invDateMap[matchedInvId];
          if (!shippedDate) return;
          const alreadySynced = r.fields?.[SOU_DATE_SHIPPED] === shippedDate && r.fields?.[SOU_STATUS] === 'Done';
          if (alreadySynced) return;
          updates.push({ id: r.id, fields: { 'Date shipped': shippedDate, 'Status': 'Done' } });
        });

        if (updates.length === 0) {
          setStatus('No souvenir records needed syncing ✓', 'success');
          return;
        }

        setStatus(`Updating ${updates.length} souvenir record(s)...`, '');
        await otPatchRecords(apiKey, SOU_TABLE, updates);
        setStatus(`Synced ${updates.length} souvenir record(s) ✓`, 'success');
        loadData();
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    card.addEventListener('click', (e) => {
      const act = e.target.dataset.act;
      if (!act) return;

      if (act === 'refresh') {
        loadData();
      } else if (act === 'cleanupSouvenir') {
        const ok = confirm('This will scan all Souvenir records linked to an Invitation marked "For posting", and set their Date shipped + Status to "Done" to match. This writes changes directly to Airtable. Continue?');
        if (ok) cleanupSouvenirRecords();
      } else if (act === 'tabWeekly') {
        card.querySelector('[data-act="tabWeekly"]').classList.add('active');
        card.querySelector('[data-act="tabMonthly"]').classList.remove('active');
        weeklyPanel.classList.remove('hidden');
        monthlyPanel.classList.remove('visible');
      } else if (act === 'tabMonthly') {
        card.querySelector('[data-act="tabMonthly"]').classList.add('active');
        card.querySelector('[data-act="tabWeekly"]').classList.remove('active');
        weeklyPanel.classList.add('hidden');
        monthlyPanel.classList.add('visible');
      } else if (act === 'toggleConfig') {
        configPanel.classList.toggle('open');
      } else if (act === 'saveKey') {
        const val = keyInput.value.trim();
        if (!val) return;
        localStorage.setItem(OT_KEY_STORAGE, val);
        loadData();
      }
    });

    keyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') card.querySelector('[data-act="saveKey"]').click();
    });

    weekLabelEl.textContent = otFormatWeekLabel();
    const prevBounds = otGetWeekBounds(-1);
    const fmt = d => d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
    prevWeekLabel.textContent = `${fmt(prevBounds.monday)} – ${fmt(prevBounds.sunday)}`;

    const savedKey = getKey();
    if (savedKey) { keyInput.value = savedKey; loadData(); }
    else { setStatus('Set Airtable API key first ↓', 'error'); configPanel.classList.add('open'); }

    return card;
  }

  // ─── Proof Checker ───────────────────────────────────────────────────────
  // Photo-status records with a Proof attached: cross-check the Breakdown
  // text's "Downpayment" / "Balance before ship out" (+ shipping fee) lines
  // against the DP and Balance fields.

  const PROOF_BREAKDOWN = 'fldD5usNmFvz8uc0z';
  const PROOF_DP = 'fldgzVcKogUmfHsv7';
  const PROOF_BALANCE = 'fldLucOfQhPc30t2W';
  const PROOF_FB_NAME = 'fld01zQJ86lA2f1F9';
  const PROOF_CLIENT_NUM = 'fld3csxglBQdezHDA';
  const PROOF_ATTACHMENT = 'fldHTnYGaKUoEkLYI';
  const META_LINK = 'fldkZTIUuy4mJt9id';

  // Extracts "Label: ₱X" and, if a "+ ₱Y ... shipping fee" line follows it
  // (same line, or a few lines down, skipping notes like "FREE 1 set"),
  // adds that Y into X — a shipping fee attached to a line means it's
  // included in that line's amount. Stops at a blank line or the next
  // distinct field label to avoid bleeding into an unrelated line.
  function extractAmountWithShipping(text, label) {
    const startRe = new RegExp(`${label}:\\s*₱?\\s*([\\d,]+(?:\\.\\d+)?)`, 'i');
    const m = text.match(startRe);
    if (!m) return null;
    let amount = parseFloat(m[1].replace(/,/g, ''));
    const shipRe = /\+\s*₱?\s*([\d,]+(?:\.\d+)?)\s*shipping fee/i;
    const stopRe = /^(Downpayment|Balance before ship out|Total)\s*:/i;
    const lines = text.slice(m.index + m[0].length).split(/\r?\n/);
    for (let i = 0; i < lines.length && i < 6; i++) {
      const line = lines[i].trim();
      if (line === '') { if (i > 0) break; else continue; }
      // Check stopRe BEFORE shipMatch: a shipping fee mentioned on a line
      // that itself starts a new field (e.g. "Balance before ship out: ₱844
      // + ₱100 shipping fee") belongs to THAT field, not the one currently
      // being parsed — confirmed bug: parsing "Downpayment" picked up the
      // ₱100 meant for the very next "Balance before ship out" line because
      // the shipping match was checked first, inflating DP by the fee.
      if (i > 0 && stopRe.test(line)) break;
      const shipMatch = line.match(shipRe);
      if (shipMatch) { amount += parseFloat(shipMatch[1].replace(/,/g, '')); break; }
      if (stopRe.test(line)) break;
    }
    return amount;
  }

  // Strips invisible bidi/formatting control chars (LRM, RLM, LRE/RLE/PDF, ZWSP, BOM)
  // that copy-pasted text (e.g. from Messenger) can carry — these break line-start
  // regex anchors like ^Balance before ship out: without being visible.
  function otStripBidiMarks(text) {
    return text.replace(/[​‌‍‎‏‪‫‬‭‮﻿]/g, '');
  }

  function parseBreakdownFigures(text) {
    if (!text) return null;
    const clean = otStripBidiMarks(text);
    const dp = extractAmountWithShipping(clean, 'Downpayment');
    const balance = extractAmountWithShipping(clean, 'Balance before ship out');
    if (dp === null || balance === null) return null;
    return { dp, balance };
  }

  // ─── Extension bridge ───────────────────────────────────────────────────
  // Connects to the MH Creatives Proof Sender extension's background worker
  // (chrome.runtime.connect over externally_connectable) to trigger the same
  // browser-automation flow the extension's own popup runs (open Messenger,
  // attach files, type, send) — the dashboard page itself has no permission
  // to do any of that directly, only the extension does. Requires the
  // dashboard to be served over http(s), not opened as a file:// page.
  //
  // portName: 'sendProofs' or 'sendTracking' (must match background.js).
  // credentials: { airtableKey, pageToken }.
  // callbacks: { onLog(msg, type), onProgress(current, total), onDone(sent, failed), onError(message) }.
  // Returns a function you can call to stop the run.
  function otConnectToExtension(portName, credentials, callbacks) {
    if (typeof chrome === 'undefined' || !chrome.runtime || !chrome.runtime.connect) {
      callbacks.onError('chrome.runtime is not available — this page must be opened in Chrome with the extension installed, served over http(s) (not file://).');
      return () => {};
    }
    const extensionId = localStorage.getItem(PROOF_EXT_ID_STORAGE) || '';
    if (!extensionId) {
      callbacks.onError('Set the Proof Sender extension ID first (⚙ below)');
      return () => {};
    }

    let port;
    try {
      port = chrome.runtime.connect(extensionId, { name: portName });
    } catch (err) {
      callbacks.onError(`Could not connect to extension: ${err.message}`);
      return () => {};
    }

    port.onMessage.addListener((msg) => {
      if (msg.kind === 'log') callbacks.onLog(msg.msg, msg.type);
      else if (msg.kind === 'progress') callbacks.onProgress(msg.current, msg.total);
      else if (msg.kind === 'done') callbacks.onDone(msg.sent, msg.failed);
      else if (msg.kind === 'error') callbacks.onError(msg.message);
    });
    port.onDisconnect.addListener(() => {
      if (chrome.runtime.lastError) {
        callbacks.onError(`Disconnected: ${chrome.runtime.lastError.message}. Check the extension ID is correct and the extension is enabled.`);
      }
    });

    port.postMessage({ action: 'start', ...credentials });
    return () => { try { port.postMessage({ action: 'stop' }); } catch {} };
  }

  function buildProofCard() {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.innerHTML = `
      <div class="tool-hd">
        <div class="tool-name">🧾 Proof</div>
        <div class="tool-actions">
          <button class="icon-btn" data-act="scan">▶ Scan</button>
        </div>
      </div>
      <div class="tool-desc">Photo-status orders with a Proof attached — checks Breakdown text against DP / Balance fields.</div>
      <div class="status-line" data-el="status"></div>
      <div class="proof-summary" data-el="summary"></div>
      <div class="proof-results" data-el="results"></div>

      <div class="ot-divider" style="margin:14px 0;"></div>
      <div class="tool-hd" style="margin-bottom:4px;">
        <div class="tool-name" style="font-size:12px;">✉ Send Proofs</div>
        <div class="tool-actions">
          <button class="icon-btn" data-act="sendProofsStart">▶ Start</button>
          <button class="icon-btn" data-act="sendProofsStop" style="display:none; color:#f87171;">■ Stop</button>
        </div>
      </div>
      <div class="tool-desc" style="margin-top:2px;">Runs the same automation as the Proof Sender extension — opens each Photo-status client's conversation, attaches their Proof files, sends the balance + payment details, then moves them to For packaging.</div>
      <div class="status-line" data-el="sendStatus"></div>
      <div class="proof-summary" data-el="sendProgress"></div>
      <div class="proof-results" data-el="sendLog" style="max-height:220px;"></div>

      <div class="config-toggle" data-act="toggleExtConfig">⚙ set proof sender extension id</div>
      <div class="config-panel" data-el="extConfigPanel">
        <div class="config-hint">
          Go to <b>chrome://extensions</b>, enable <b>Developer mode</b>, find <b>MH Creatives Proof Sender</b>, and copy its ID here. Requires this dashboard to be open at an <b>http(s)://</b> address (not a local file).
        </div>
        <div class="id-row">
          <input type="text" data-el="extIdInput" placeholder="32-character extension id" autocomplete="off" spellcheck="false" />
          <button class="save-btn" data-act="saveExtId">Save</button>
        </div>
      </div>
    `;

    const el = sel => card.querySelector(`[data-el="${sel}"]`);
    const statusEl = el('status');
    const summaryEl = el('summary');
    const resultsEl = el('results');
    const sendStatusEl = el('sendStatus');
    const sendProgressEl = el('sendProgress');
    const sendLogEl = el('sendLog');
    const extConfigPanel = el('extConfigPanel');
    const extIdInput = el('extIdInput');
    const btnStart = card.querySelector('[data-act="sendProofsStart"]');
    const btnStop = card.querySelector('[data-act="sendProofsStop"]');

    let stopSending = null;

    function setSendStatus(text, cls) {
      sendStatusEl.className = `status-line ${cls || ''}`;
      sendStatusEl.innerHTML = text ? `<span class="status-dot ${cls || ''}"></span>${text}` : '';
    }

    function appendSendLog(msg, type) {
      const line = document.createElement('div');
      line.className = 'proof-diff';
      if (type === 'success') line.style.color = '#4ade80';
      else if (type === 'error') line.style.color = '#f87171';
      else if (type === 'highlight') { line.style.color = '#fff'; line.style.fontWeight = '600'; }
      line.textContent = msg;
      sendLogEl.appendChild(line);
      sendLogEl.scrollTop = sendLogEl.scrollHeight;
    }

    function startSendProofs() {
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      const pageToken = localStorage.getItem(FB_PAGE_TOKEN_STORAGE) || '';
      if (!apiKey) { setSendStatus('Set Airtable API key in Order Tracker first ↓', 'error'); return; }
      if (!pageToken) { setSendStatus('Set Facebook Page token in the Balance card first', 'error'); return; }

      sendLogEl.innerHTML = '';
      sendProgressEl.textContent = '';
      setSendStatus('Starting...', '');
      btnStart.style.display = 'none';
      btnStop.style.display = '';

      stopSending = otConnectToExtension('sendProofs', { airtableKey: apiKey, pageToken }, {
        onLog: (msg, type) => appendSendLog(msg, type),
        onProgress: (current, total) => { sendProgressEl.textContent = `${current} / ${total} record(s)`; },
        onDone: (sent, failed) => {
          setSendStatus(`Done — ${sent} sent, ${failed} failed`, sent > 0 ? 'success' : 'error');
          btnStart.style.display = '';
          btnStop.style.display = 'none';
        },
        onError: (message) => {
          setSendStatus(`Error: ${message}`, 'error');
          btnStart.style.display = '';
          btnStop.style.display = 'none';
        },
      });
    }

    function setStatus(text, cls) {
      statusEl.className = `status-line ${cls || ''}`;
      statusEl.innerHTML = text ? `<span class="status-dot ${cls || ''}"></span>${text}` : '';
    }

    function renderResults(mismatches) {
      if (mismatches.length === 0) {
        resultsEl.innerHTML = '';
        return;
      }
      resultsEl.innerHTML = mismatches.map(m => `
        <div class="proof-item">
          <div class="proof-name">${m.name}${m.clientNum ? ` <span>#${m.clientNum}</span>` : ''}</div>
          ${m.unparsed ? `<div class="proof-diff">Could not find Downpayment / Balance before ship out lines in Breakdown</div>` : ''}
          ${!m.unparsed && !m.dpOk ? `<div class="proof-diff">DP: breakdown ${otFormatPeso(m.dpExpected)} ≠ field ${otFormatPeso(m.dpActual)}</div>` : ''}
          ${!m.unparsed && !m.balOk ? `<div class="proof-diff">Balance: breakdown ${otFormatPeso(m.balExpected)} ≠ field ${otFormatPeso(m.balActual)}</div>` : ''}
          <a class="proof-link" href="https://airtable.com/${OT_BASE_ID}/${INV_TABLE}/${m.id}" target="_blank" rel="noopener">Open record ↗</a>
        </div>
      `).join('');
    }

    async function scan() {
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      if (!apiKey) {
        setStatus('Set Airtable API key in Order Tracker first ↓', 'error');
        return;
      }

      setStatus('Scanning...', '');
      summaryEl.textContent = '';
      resultsEl.innerHTML = '';

      try {
        const allRecords = await otFetchRecords(
          apiKey, INV_TABLE, INV_STATUS, PROOF_DP, PROOF_BALANCE,
          `{Status}="Photo"`,
          [PROOF_BREAKDOWN, PROOF_FB_NAME, PROOF_CLIENT_NUM, PROOF_ATTACHMENT]
        );
        const records = allRecords.filter(r => Array.isArray(r.fields?.[PROOF_ATTACHMENT]) && r.fields[PROOF_ATTACHMENT].length > 0);

        const mismatches = [];
        let ok = 0, skipped = 0;
        records.forEach(r => {
          const name = r.fields?.[PROOF_FB_NAME] || 'Unnamed';
          const clientNum = r.fields?.[PROOF_CLIENT_NUM];
          const parsed = parseBreakdownFigures(r.fields?.[PROOF_BREAKDOWN]);
          if (!parsed) {
            skipped++;
            mismatches.push({ id: r.id, name, clientNum, unparsed: true });
            return;
          }
          const dpActual = r.fields?.[PROOF_DP] ?? 0;
          const balActual = r.fields?.[PROOF_BALANCE] ?? 0;
          const dpOk = Math.abs(parsed.dp - dpActual) < 1;
          const balOk = Math.abs(parsed.balance - balActual) < 1;
          if (dpOk && balOk) { ok++; return; }
          mismatches.push({
            id: r.id,
            name, clientNum,
            dpExpected: parsed.dp, dpActual, dpOk,
            balExpected: parsed.balance, balActual, balOk,
          });
        });

        summaryEl.textContent = `${records.length} scanned · ${mismatches.length} mismatch(es) · ${ok} ok · ${skipped} unparsed`;
        setStatus(mismatches.length ? `${mismatches.length} mismatch(es) found` : 'All matched ✓', mismatches.length ? 'error' : 'success');
        renderResults(mismatches);
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    card.addEventListener('click', (e) => {
      const act = e.target.dataset.act;
      if (act === 'scan') {
        scan();
      } else if (act === 'sendProofsStart') {
        startSendProofs();
      } else if (act === 'sendProofsStop') {
        if (stopSending) stopSending();
        setSendStatus('Stopping after current record...', '');
      } else if (act === 'toggleExtConfig') {
        extConfigPanel.classList.toggle('open');
      } else if (act === 'saveExtId') {
        const val = extIdInput.value.trim();
        if (!val) return;
        localStorage.setItem(PROOF_EXT_ID_STORAGE, val);
        setSendStatus('Extension ID saved ✓', 'success');
      }
    });

    const savedExtId = localStorage.getItem(PROOF_EXT_ID_STORAGE) || '';
    if (savedExtId) extIdInput.value = savedExtId;

    return card;
  }

  // ─── Shipping Checker ────────────────────────────────────────────────────
  // "For packaging" status records: flags ones whose Shipping details field
  // is empty, or has no recognizable phone number in it.

  const SHIP_DETAILS = 'fldDw79dyY2KviSRj';
  const SHIP_PSID = 'fldYDT7ducKjtNf0i';
  const FB_PAGE_ID_STORAGE = 'mh_fb_page_id';
  const FB_PAGE_TOKEN_STORAGE = 'mh_fb_page_token';
  const SHIPPING_FORM_TEMPLATE =
`Recipient Name:
Active Number:

Address
Unit/House No./Bldg.:
Street:
Barangay:
City/Municipality:
Province:
Postal/zip code:`;

  // Loose on purpose — this only needs to catch "is a phone number present
  // at all" for staff to know whether to follow up, not validate it's
  // exactly correct. Was requiring an exact digit count (09 + 9 digits, or
  // 639 + 9 digits) and rejecting anything even one digit off — confirmed
  // case: "+63909386100" is a real client-provided number, just missing one
  // digit after the country code, and got flagged as "no number" entirely.
  function otHasPhoneNumber(text) {
    if (!text) return false;
    const digits = text.replace(/\D/g, '');
    return /0\d{9,11}/.test(digits) || /63\d{8,10}/.test(digits);
  }

  // Matches actual "Label:" lines from the shipping form template, not loose
  // keywords — a message full of unrelated prose that happens to mention
  // "address" or a city name should NOT be mistaken for a filled-out reply.
  const SHIPPING_LABEL_PATTERNS = [
    /recipient\s*name\s*:/i,
    /active\s*number\s*:/i,
    /unit\s*\/?\s*house\s*(no\.?|number)?\s*\/?\s*bldg\.?\s*:/i,
    /street\s*:/i,
    /barangay\s*:/i,
    /city\s*\/?\s*municipality\s*:/i,
    /province\s*:/i,
    /postal\s*\/?\s*zip\s*code\s*:/i,
  ];

  function otLooksLikeFilledShippingForm(text) {
    if (!text) return false;
    return SHIPPING_LABEL_PATTERNS.filter(re => re.test(text)).length >= 3;
  }

  // Some clients answer with the same info (name, number(s), address, zip)
  // but skip the "Label:" prefixes entirely — just plain lines, e.g.:
  //   Lysida Lacorte
  //   0905 245 0390
  //   32-A
  //   Road 2
  //   Bagong Pag-Asa
  //   Quezon City
  //   Metro Manila
  //   1105
  // otLooksLikeFilledShippingForm requires 3+ literal labels and misses this
  // entirely. Heuristic instead: a phone number, several short lines, and a
  // last line that's JUST a 4-digit zip code (not a sentence that happens to
  // contain a 4-digit number, e.g. a year) — permissive on purpose since the
  // caller always requires a human to click "Approve" before this reaches
  // Airtable, but not so loose it swallows unrelated forms (confirmed false
  // positive: a wedding-details questionnaire reply with a phone number in
  // its RSVP line and "2026" in an event-date sentence).
  //
  // Other known form templates whose replies must never be mistaken for
  // shipping details, even though they can contain a phone number.
  const OTHER_FORM_LABEL_PATTERNS = [
    /groom\s*:/i,
    /bride\s*:/i,
    /nicknames?\s*(for\s*front\s*page)?\s*:/i,
    /event\s*date\s*(and\s*time)?\s*:/i,
    /ceremony\s*(&|and)?\s*reception\s*:/i,
    /colors?\s*\/?\s*motif\s*:/i,
    /gift\s*guide\s*:/i,
    /rsvp\s*:/i,
  ];

  function otLooksLikeFreeformShippingReply(text) {
    if (!text || !otHasPhoneNumber(text)) return false;
    if (OTHER_FORM_LABEL_PATTERNS.some(re => re.test(text))) return false;
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length < 4) return false;
    // A bare 4-digit zip line anywhere, not just as the final line — some
    // replies add "Philippines" and/or a repeated landmark/notes line after
    // the zip (confirmed case: zip followed by "Philippines" then a
    // "Shipping notes:" section repeating the landmark, which broke the
    // old last-line-only check entirely).
    return lines.some(l => /^\d{4}$/.test(l));
  }

  function otLooksLikeShippingReply(text) {
    return otLooksLikeFilledShippingForm(text) || otLooksLikeFreeformShippingReply(text);
  }

  // Fetches a URL and parses JSON, automatically retrying on Facebook's
  // transient "(#2) Service temporarily unavailable" error (and a couple
  // other known-transient codes) with backoff, since this is a real server-
  // side hiccup rather than something a retry-free call should give up on.
  async function otFetchJsonWithRetry(url, options, maxRetries) {
    const retries = maxRetries ?? 3;
    let lastErr;
    for (let attempt = 0; attempt <= retries; attempt++) {
      try {
        const resp = await fetch(url, options);
        const data = await resp.json();
        const code = data?.error?.code;
        const isTransient = code === 2 || code === 1 || code === 4 || code === 17;
        if (data.error && isTransient && attempt < retries) {
          await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
          continue;
        }
        if (data.error) throw new Error(data.error.message || 'Graph API error');
        return data;
      } catch (err) {
        lastErr = err;
        if (attempt < retries && /temporarily unavailable|network/i.test(err.message || '')) {
          await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
          continue;
        }
        throw err;
      }
    }
    throw lastErr;
  }

  // Fetches the entire message history for the conversation with this PSID,
  // following pagination (paging.next) until exhausted. Capped at 40 pages
  // (~4000 messages at 100/page) as a safety net against runaway loops.
  // Never trusts the API's return order — sorts by actual created_time
  // (newest first) explicitly before returning.
  // Returns { messages, participantName } — participantName lets the caller
  // sanity-check that the PSID on file actually points at the right person's
  // conversation, since a wrong/stale PSID silently returns a real but
  // unrelated conversation with no error (confirmed to happen in practice).
  async function otFetchConversationMessages(pageId, token, psid) {
    const url = `https://graph.facebook.com/v19.0/${pageId}/conversations?platform=messenger&user_id=${encodeURIComponent(psid)}&fields=participants,messages.limit(100){message,from,created_time,attachments{mime_type,name,image_data,file_url,payload}}&access_token=${encodeURIComponent(token)}`;
    const data = await otFetchJsonWithRetry(url);
    const convo = data.data?.[0];
    if (!convo || !convo.messages) return { messages: [], participantName: null };

    const participantName = (convo.participants?.data || []).find(p => p.id !== pageId)?.name || null;

    let allMessages = convo.messages.data || [];
    let nextUrl = convo.messages.paging?.next || null;
    let pages = 0;
    while (nextUrl && pages < 40) {
      const pageData = await otFetchJsonWithRetry(nextUrl);
      allMessages = allMessages.concat(pageData.data || []);
      nextUrl = pageData.paging?.next || null;
      pages++;
    }
    const messages = allMessages.sort((a, b) => new Date(b.created_time) - new Date(a.created_time));
    return { messages, participantName };
  }

  // Scans the entire conversation for: (a) whether the client already replied
  // with a filled-out shipping form, (b) whether we already sent the request
  // template. Falls back to checking a window of recent user messages
  // concatenated together, in case the client split their reply across
  // multiple message bubbles instead of sending it as one message.
  async function otCheckConversationState(pageId, token, psid) {
    const { messages } = await otFetchConversationMessages(pageId, token, psid);
    const pageSent = messages.some(m => m.from?.id === pageId && (m.message || '').includes('Recipient Name:'));

    const singleMatch = messages.find(m => m.from?.id !== pageId && otLooksLikeShippingReply(m.message));
    if (singleMatch) return { pageSent, userReply: singleMatch.message };

    // A fixed-size window (previously 8, then 15) kept truncating longer
    // replies — a full address split line-by-line across separate bubbles
    // (name, 2 phone numbers, unit, street, barangay, city, province, zip =
    // 9 messages) can exceed any small cap on its own (confirmed case:
    // "Lysida Lacorte" + 2 numbers + 6 address lines went undetected).
    // Instead, scan every client message from the most recent time we sent
    // the request all the way to the end of the conversation — no count
    // cap — while still anchoring to "after we asked" so unrelated early
    // conversation history can't accidentally match or disqualify via
    // OTHER_FORM_LABEL_PATTERNS.
    // `messages` is sorted newest-first, so the request we most recently
    // sent is the FIRST page message found, and every user message at or
    // before that index in the array is chronologically after it.
    const lastRequestIdx = messages.findIndex(m => m.from?.id === pageId && (m.message || '').includes('Recipient Name:'));
    const messagesSinceRequest = lastRequestIdx === -1 ? messages : messages.slice(0, lastRequestIdx);
    const userMsgs = messagesSinceRequest.filter(m => m.from?.id !== pageId && m.message);
    const combined = userMsgs.map(m => m.message).reverse().join('\n');
    if (otLooksLikeShippingReply(combined)) return { pageSent, userReply: combined };

    return { pageSent, userReply: null };
  }

  async function otSendMessengerMessage(pageId, token, psid, text) {
    const url = `https://graph.facebook.com/v19.0/${pageId}/messages?access_token=${encodeURIComponent(token)}`;
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recipient: { id: psid },
        messaging_type: 'RESPONSE',
        message: { text },
      }),
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message || 'Graph API error');
    return data;
  }

  function otHasReceiptAttachment(messages, pageId) {
    return messages.some(m => m.from?.id !== pageId && Array.isArray(m.attachments?.data) && m.attachments.data.length > 0);
  }

  // The balance-request message's fixed wording, with the variable ₱ amount
  // excluded — e.g. "Hello po, here's the final output. Kindly settle the
  // balance total of ₱550, para mapaship na po. Salamat!😊" — matching on all
  // of these static fragments (not just one short phrase) is a much more
  // precise anchor than a generic substring, without depending on the
  // specific amount (which can vary in formatting or be hard to match exactly).
  // Only attachments the client sent AFTER this message count as a real
  // receipt — anything sent earlier (proof photos, vow cards, other chat
  // images) is unrelated and shouldn't be mistaken for payment proof.
  const BALANCE_REQUEST_ANCHOR_PARTS = [
    'kindly settle the balance total of',
    'para mapaship na po',
  ];

  // Normalizes curly/smart quotes to straight ones — messages may contain
  // ’ (U+2019) instead of a plain apostrophe, which would silently break an
  // exact substring match against a hardcoded straight-quote string.
  function otNormalizeQuotes(text) {
    return text.replace(/[‘’]/g, "'").replace(/[“”]/g, '"');
  }

  // Loose name comparison — true if the two names share at least one
  // meaningful word (case-insensitive, ignoring short/common words). Nicknames
  // vs. legal names are common (e.g. "Shane Lacson" vs. "Chrystel Shane Tria
  // Lubrico"), so this only needs to rule out names that are genuinely
  // unrelated, not flag every formatting difference.
  function otNamesLooselyMatch(nameA, nameB) {
    const tokenize = s => (s || '').toLowerCase().split(/\s+/).filter(w => w.length > 2);
    const tokensA = new Set(tokenize(nameA));
    const tokensB = tokenize(nameB);
    return tokensB.some(w => tokensA.has(w));
  }

  // Stricter than otNamesLooselyMatch: a single shared word is too weak to
  // resolve a PSID by (confirmed false positive: "Sheryl Jean Panagsagan" vs.
  // "Nai Jean Belen Dancel" both contain "Jean", a common middle name).
  // Requires at least half of the record name's meaningful words to also
  // appear in the candidate's name — still permissive enough for the
  // nickname case ("Shane Lacson" vs. "Chrystel Shane Tria Lubrico" is 1
  // of 2 = 50%), but a lone shared common word in a longer name no longer
  // qualifies on its own. Returns the match fraction (0 if no shared words).
  function otNameMatchScore(recordName, candidateName) {
    const tokenize = s => (s || '').toLowerCase().split(/\s+/).filter(w => w.length > 2);
    const recordTokens = tokenize(recordName);
    if (recordTokens.length === 0) return 0;
    const candidateTokens = new Set(tokenize(candidateName));
    const shared = recordTokens.filter(w => candidateTokens.has(w)).length;
    return shared / recordTokens.length;
  }
  const OT_NAME_MATCH_MIN_SCORE = 0.5;

  // How long after the balance-request message we're still willing to treat
  // a client attachment as a plausible receipt reply. Anything sent later
  // than this is more likely an unrelated photo from a later conversation.
  // Confirmed in practice that clients often pay and send proof days (not
  // hours) after being asked to settle the balance, so a 24h window was
  // silently excluding real receipts — widened to a week. Every candidate
  // in this window costs a Gemini call to verify, but MAX_RECEIPT_CANDIDATES_TO_CHECK
  // below still caps that per record regardless of how wide the window is.
  const RECEIPT_WINDOW_HOURS = 24 * 7;

  // Cap how many candidate attachments get sent to Gemini per record — stop
  // after this many even if the window has more, since a genuine receipt
  // reply is almost always among the first few things sent.
  const MAX_RECEIPT_CANDIDATES_TO_CHECK = 3;

  // Finds the most recent attachment sent by the client (not the page) AFTER
  // the balance-request message, and resolves an actual image URL from
  // whichever shape the API returned it in — plain photos usually come back
  // under image_data.url, while rich "card" shares (like GCash's payment
  // confirmation) may use payload.url/image_url instead.
  // Expects `messages` to already be sorted newest-first by created_time
  // (otFetchConversationMessages guarantees this), so everything before the
  // anchor's index is chronologically after it.
  // Returns every candidate image attachment the client sent after the
  // balance-request message (most recent first) — NOT just the first one —
  // since the client may send other unrelated photos (product samples,
  // packaging, etc.) after that point too. The caller is responsible for
  // checking which candidate (if any) is actually a receipt.
  // `balance`, if provided, is the record's current pending amount. Requiring
  // the anchor message to also mention this amount avoids latching onto a
  // stale/unrelated "settle the balance" request from a previously-resolved
  // amount (confirmed to happen in practice — a client's only such message
  // asked for ₱50 weeks ago, unrelated to their current ₱550 balance).
  //
  // Identity is matched against `psid` (the client), not `pageId` — a
  // message sent by a staff member while "assigned" to the conversation can
  // be attributed to that staff member's own ID rather than the page's,
  // so testing "is this the client" (=== psid) is more reliable than testing
  // "is this NOT the page" (!== pageId), which would wrongly treat a staff
  // member's message as if it came from the client.
  // The known image_data/payload/file_url shapes miss some real attachments
  // (confirmed in practice: certain client-sent images came back as
  // attachment objects with the URL nested somewhere else, e.g. under a
  // "video_data" preview, a "sticker_id"-adjacent payload, or a differently
  // named subfield depending on how the client's app shared the image). Try
  // the known fields first, then fall back to a recursive scan for any
  // string value on a key that looks like a URL, so a shape we haven't seen
  // yet doesn't silently produce zero candidates.
  function otExtractAttachmentImageUrl(att) {
    const known = att.image_data?.url || att.image_data?.preview_url
      || att.video_data?.url || att.video_data?.preview_url
      || att.payload?.url || att.payload?.image_url
      || att.file_url || null;
    if (known) return known;
    const seen = new Set();
    const stack = [att];
    while (stack.length) {
      const node = stack.pop();
      if (!node || typeof node !== 'object' || seen.has(node)) continue;
      seen.add(node);
      for (const [key, value] of Object.entries(node)) {
        if (typeof value === 'string' && /url/i.test(key) && /^https?:\/\//i.test(value)) return value;
        if (value && typeof value === 'object') stack.push(value);
      }
    }
    return null;
  }

  function otFindReceiptCandidates(messages, psid, balance) {
    const amountDigits = typeof balance === 'number' && balance > 0 ? String(Math.round(balance)) : null;
    const phraseMatchesText = text => BALANCE_REQUEST_ANCHOR_PARTS.every(part => text.includes(part));
    const messageNumberTokens = text => (text.match(/\d[\d,]*/g) || []).map(t => t.replace(/,/g, ''));

    // Prefer a phrase+amount match (most specific, avoids latching onto a
    // stale prior "settle the balance" request for a different amount).
    let anchorIndex = messages.findIndex(m => {
      if (m.from?.id === psid) return false;
      const text = otNormalizeQuotes(otStripBidiMarks((m.message || '').toLowerCase()));
      if (!phraseMatchesText(text)) return false;
      return amountDigits ? messageNumberTokens(text).includes(amountDigits) : true;
    });
    let anchorAmountUnverified = false;
    // Fall back to a phrase-only match when there's exactly one candidate
    // message in the whole conversation — requiring the amount to ALSO match
    // was rejecting genuine anchors outright (confirmed in practice: the
    // record's current balance can drift from what an older, still-valid
    // request literally said, e.g. after a manual adjustment), and with only
    // one phrase match there's nothing else it could plausibly be.
    if (anchorIndex < 0 && amountDigits) {
      const phraseOnlyIndices = [];
      messages.forEach((m, idx) => {
        if (m.from?.id === psid) return;
        const text = otNormalizeQuotes(otStripBidiMarks((m.message || '').toLowerCase()));
        if (phraseMatchesText(text)) phraseOnlyIndices.push(idx);
      });
      if (phraseOnlyIndices.length === 1) {
        anchorIndex = phraseOnlyIndices[0];
        anchorAmountUnverified = true;
      }
    }
    const anchorFound = anchorIndex >= 0;
    // Without the anchor, there's no reliable way to tell a receipt apart
    // from any other photo the client sent (product samples, proofs, etc.)
    // — don't guess; report that the anchor wasn't found instead. Surface any
    // non-client message that partially matches (mentions "balance" or
    // "mapaship") so a near-miss (wording drift, hidden characters, etc.) is
    // visible instead of a bare "not found" with zero diagnostic info.
    if (!anchorFound) {
      const nearMisses = messages
        .filter(m => m.from?.id !== psid)
        .map(m => otNormalizeQuotes(otStripBidiMarks((m.message || '').toLowerCase())))
        .filter(text => text.includes('balance') || text.includes('mapaship'))
        .map(text => ({
          text,
          matchesPart1: text.includes(BALANCE_REQUEST_ANCHOR_PARTS[0]),
          matchesPart2: text.includes(BALANCE_REQUEST_ANCHOR_PARTS[1]),
          numberTokensFound: (text.match(/\d[\d,]*/g) || []).map(t => t.replace(/,/g, '')),
        }));
      return { candidates: [], anchorFound: false, debug: { targetAmountDigits: amountDigits, nearMisses } };
    }
    const anchorTime = new Date(messages[anchorIndex].created_time);
    const cutoffTime = new Date(anchorTime.getTime() + RECEIPT_WINDOW_HOURS * 60 * 60 * 1000);
    // Only messages after the anchor AND within the time window — stop there,
    // don't keep scanning forward into unrelated later conversation.
    const messagesAfterAnchor = messages.slice(0, anchorIndex);
    const windowMessages = messagesAfterAnchor.filter(m => new Date(m.created_time) <= cutoffTime);
    const clientMessages = windowMessages.filter(m => m.from?.id === psid);
    const clientAttachments = clientMessages.flatMap(m => m.attachments?.data || []);

    // All client messages after the anchor, ignoring the 24h window — lets
    // debug output reveal a reply that arrived late (outside the window)
    // instead of that case looking identical to "never replied at all".
    const allClientMessagesAfterAnchor = messagesAfterAnchor.filter(m => m.from?.id === psid);
    const lateClientMessages = allClientMessagesAfterAnchor.filter(m => new Date(m.created_time) > cutoffTime);

    const candidates = [];
    for (const m of clientMessages) {
      const atts = m.attachments?.data || [];
      for (const att of atts) {
        const imageUrl = otExtractAttachmentImageUrl(att);
        if (imageUrl) candidates.push({ attachment: att, imageUrl, created_time: m.created_time });
      }
    }
    // Always attach anchor/candidate timing info so it's possible to verify
    // empirically (via window.mhDebugBalance) that nothing before the anchor
    // is slipping into the results, instead of just trusting the slice logic.
    const debug = {
      anchorMessage: messages[anchorIndex].message,
      anchorTime: messages[anchorIndex].created_time,
      anchorAmountUnverified,
      cutoffTime: cutoffTime.toISOString(),
      candidateMessageCount: windowMessages.length,
      clientMessageCount: clientMessages.length,
      clientAttachmentCount: clientAttachments.length,
      candidateTimes: candidates.map(c => c.created_time),
      rawAttachments: candidates.length < clientAttachments.length ? clientAttachments : undefined,
      lateClientMessageCount: lateClientMessages.length,
      lateClientMessageTimes: lateClientMessages.map(m => m.created_time),
      lateClientAttachmentCount: lateClientMessages.flatMap(m => m.attachments?.data || []).length,
    };
    return { candidates, anchorFound, debug };
  }

  const GEMINI_KEY_STORAGE = 'mh_gemini_api_key';
  const GEMINI_MODEL = 'gemini-3.6-flash';

  async function otImageUrlToBase64(url) {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`Could not fetch image (HTTP ${resp.status})`);
    const blob = await resp.blob();
    const mimeType = blob.type || 'image/jpeg';
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(String(reader.result).split(',')[1] || '');
      reader.onerror = () => reject(new Error('Failed to read image data'));
      reader.readAsDataURL(blob);
    });
    return { base64, mimeType };
  }

  // Sends the receipt image to Gemini and asks it to extract the paid amount,
  // the payment method/receipt type, who it was sent to, and a reference
  // number if visible.
  // Keyword → type map used to deterministically override Gemini's "type"
  // guess by scanning its own raw text transcription — more reliable than
  // trusting the model's judgment call on ambiguous card branding alone.
  const RECEIPT_TYPE_KEYWORDS = [
    { type: 'GCash', patterns: ['transfer completed', 'ref no.', 'total amount sent', 'gcash', 'g-xchange'] },
    { type: 'Maya', patterns: ['maya', 'paymaya'] },
    { type: 'BPI', patterns: ['bpi', 'bank of the philippine islands'] },
    { type: 'BDO', patterns: ['bdo', 'banco de oro'] },
    { type: 'InstaPay', patterns: ['instapay'] },
  ];

  function otInferReceiptType(rawText) {
    if (!rawText) return null;
    const lower = rawText.toLowerCase();
    for (const { type, patterns } of RECEIPT_TYPE_KEYWORDS) {
      if (patterns.some(p => lower.includes(p))) return type;
    }
    return null;
  }

  async function otAnalyzeReceiptWithGemini(geminiKey, imageUrl) {
    const { base64, mimeType } = await otImageUrlToBase64(imageUrl);
    const prompt = `You are examining a photo that a client sent in a business chat, to determine if it's a payment receipt / payment confirmation screenshot (e.g. GCash, Maya/PayMaya, bank transfer, InstaPay, or similar) — as opposed to something unrelated, like a product photo, a packaging photo, a screenshot of an order form, or anything else that isn't proof of payment.

First, transcribe every piece of text visible on the image, line by line, into "rawText" — do this thoroughly and completely before filling in the other fields, since they should be derived FROM this transcription.

Then extract:
- isReceipt: true only if this image is genuinely a payment receipt/confirmation (a completed transaction showing an amount paid, a reference number, "transfer completed"/"payment sent" type wording, or similar). false for anything else, including product photos, packaging, order forms, or general chat images — even if they contain some numbers or text.
- amount: the total amount paid/transferred (use "Total Amount"/"Total Amount Sent" if both a base amount and a total with fees are shown), as a plain number (no currency symbol, no commas). null if isReceipt is false.
- type: what kind of receipt/payment method it is (e.g. "GCash", "Maya", "BPI", "BDO", "InstaPay", "Bank Transfer"). Only use "Unknown" if isReceipt is true but there is truly no textual or visual cue at all in your transcription.
- recipientName: the name shown in the "To" / recipient section, if visible, else null
- recipientDestination: the platform/provider the money was sent to, read from the "To" section (e.g. "GCash", "G-Xchange, Inc.", "BPI"), if visible, else null
- refNo: the reference/transaction number if visible (e.g. after "Ref No."), else null
- timestamp: the date/time shown on the receipt, converted to 12-hour format with AM/PM (e.g. "Aug 20, 2026 01:12 PM"), else null`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(geminiKey)}`;
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: mimeType, data: base64 } },
          ],
        }],
        generationConfig: {
          response_mime_type: 'application/json',
          response_schema: {
            type: 'OBJECT',
            properties: {
              rawText: { type: 'STRING' },
              isReceipt: { type: 'BOOLEAN' },
              amount: { type: 'NUMBER', nullable: true },
              type: { type: 'STRING' },
              recipientName: { type: 'STRING', nullable: true },
              recipientDestination: { type: 'STRING', nullable: true },
              refNo: { type: 'STRING', nullable: true },
              timestamp: { type: 'STRING', nullable: true },
            },
            required: ['rawText', 'isReceipt', 'type'],
            propertyOrdering: ['rawText', 'isReceipt', 'amount', 'type', 'recipientName', 'recipientDestination', 'refNo', 'timestamp'],
          },
        },
      }),
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message || 'Gemini API error');
    const textOut = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!textOut) throw new Error('No response from Gemini');
    const result = JSON.parse(textOut);

    if (!result.type || result.type.toLowerCase() === 'unknown') {
      const inferred = otInferReceiptType(result.rawText);
      if (inferred) result.type = inferred;
    }
    return result;
  }

  function buildShippingCard() {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.innerHTML = `
      <div class="tool-hd">
        <div class="tool-name">📦 Shipping</div>
        <div class="tool-actions">
          <button class="icon-btn" data-act="scan">▶ Scan</button>
        </div>
      </div>
      <div class="tool-desc">"For packaging" orders — flags missing Shipping details or no phone number found.</div>
      <div class="status-line" data-el="status"></div>
      <div class="proof-summary" data-el="summary"></div>
      <div class="proof-results" data-el="results"></div>

      <div class="config-toggle" data-act="toggleConfig">⚙ set facebook page credentials</div>
      <div class="config-panel" data-el="configPanel">
        <div class="config-hint">
          Facebook <b>Page ID</b> and <b>Page access token</b> (from your Meta App). Used to check/send the shipping details request via Messenger. Stored locally in this browser only.
        </div>
        <div class="id-row">
          <input type="text" data-el="pageIdInput" placeholder="Page ID" autocomplete="off" spellcheck="false" />
        </div>
        <div class="id-row" style="margin-top:8px;">
          <input type="password" data-el="pageTokenInput" placeholder="Page access token" autocomplete="off" spellcheck="false" />
          <button class="save-btn" data-act="saveFbCreds">Save</button>
        </div>
      </div>

      <div class="ot-divider" style="margin:14px 0;"></div>
      <div class="tool-hd" style="margin-bottom:4px;">
        <div class="tool-name" style="font-size:12px;">📦 Send Tracking Numbers</div>
        <div class="tool-actions">
          <button class="icon-btn" data-act="sendTrackStart">▶ Start</button>
          <button class="icon-btn" data-act="sendTrackStop" style="display:none; color:#f87171;">■ Stop</button>
        </div>
      </div>
      <div class="tool-desc" style="margin-top:2px;">Same as the extension: for every record with a Tracking number set (and not yet For posting/Done), sends the tracking message via Messenger and moves the order to For posting.</div>
      <div class="status-line" data-el="trackStatus"></div>
      <div class="proof-summary" data-el="trackProgress"></div>
      <div class="proof-results" data-el="trackLog" style="max-height:220px;"></div>

      <div class="config-toggle" data-act="toggleExtConfig">⚙ set proof sender extension id</div>
      <div class="config-panel" data-el="extConfigPanel">
        <div class="config-hint">
          Same extension ID as the Proof card's Send Proofs tool. Requires this dashboard to be open at an <b>http(s)://</b> address (not a local file).
        </div>
        <div class="id-row">
          <input type="text" data-el="extIdInput" placeholder="32-character extension id" autocomplete="off" spellcheck="false" />
          <button class="save-btn" data-act="saveExtId">Save</button>
        </div>
      </div>
    `;

    const el = sel => card.querySelector(`[data-el="${sel}"]`);
    const statusEl = el('status');
    const summaryEl = el('summary');
    const resultsEl = el('results');
    const configPanel = el('configPanel');
    const pageIdInput = el('pageIdInput');
    const pageTokenInput = el('pageTokenInput');
    const trackStatusEl = el('trackStatus');
    const trackProgressEl = el('trackProgress');
    const trackLogEl = el('trackLog');
    const extConfigPanel = el('extConfigPanel');
    const extIdInput = el('extIdInput');
    const btnTrackStart = card.querySelector('[data-act="sendTrackStart"]');
    const btnTrackStop = card.querySelector('[data-act="sendTrackStop"]');

    let stopTracking = null;

    function setTrackStatus(text, cls) {
      trackStatusEl.className = `status-line ${cls || ''}`;
      trackStatusEl.innerHTML = text ? `<span class="status-dot ${cls || ''}"></span>${text}` : '';
    }

    function appendTrackLog(msg, type) {
      const line = document.createElement('div');
      line.className = 'proof-diff';
      if (type === 'success') line.style.color = '#4ade80';
      else if (type === 'error') line.style.color = '#f87171';
      else if (type === 'highlight') { line.style.color = '#fff'; line.style.fontWeight = '600'; }
      line.textContent = msg;
      trackLogEl.appendChild(line);
      trackLogEl.scrollTop = trackLogEl.scrollHeight;
    }

    function startSendTracking() {
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      if (!apiKey) { setTrackStatus('Set Airtable API key in Order Tracker first ↓', 'error'); return; }

      trackLogEl.innerHTML = '';
      trackProgressEl.textContent = '';
      setTrackStatus('Starting...', '');
      btnTrackStart.style.display = 'none';
      btnTrackStop.style.display = '';

      stopTracking = otConnectToExtension('sendTracking', { airtableKey: apiKey }, {
        onLog: (msg, type) => appendTrackLog(msg, type),
        onProgress: (current, total) => { trackProgressEl.textContent = `${current} / ${total} order(s)`; },
        onDone: (sent, failed) => {
          setTrackStatus(`Done — ${sent} sent, ${failed} failed`, sent > 0 ? 'success' : 'error');
          btnTrackStart.style.display = '';
          btnTrackStop.style.display = 'none';
        },
        onError: (message) => {
          setTrackStatus(`Error: ${message}`, 'error');
          btnTrackStart.style.display = '';
          btnTrackStop.style.display = 'none';
        },
      });
    }

    let lastFlagged = [];

    function setStatus(text, cls) {
