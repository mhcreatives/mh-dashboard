      const openCount = allTasks.filter(t => !t.done).length;
      const doneCount = allTasks.length - openCount;
      summaryEl.innerHTML = allTasks.length === 0 ? '' : `
        <span>${openCount} open · ${doneCount} done</span>
        ${doneCount > 0 ? `<button class="icon-btn" data-act="clearCompleted">Clear completed</button>` : ''}
      `;
      if (allTasks.length === 0) { listEl.innerHTML = ''; return; }
      const today = todayKeyLocal();
      // Done tasks sink to the bottom, but keep each group's own relative
      // order (a stable partition, not a re-sort within each group).
      const tasks = [...allTasks.filter(t => !t.done), ...allTasks.filter(t => t.done)];
      listEl.innerHTML = tasks.map(t => {
        const priority = t.priority || 'none';
        const checkboxColorVar = `--task-priority-color: ${PRIORITY_COLORS[priority]};`;
        if (t.id === editingTaskId) {
          return `
            <div class="task-row" style="flex-wrap:wrap;">
              <input type="checkbox" data-id="${t.id}" ${t.done ? 'checked' : ''} style="${checkboxColorVar}" />
              <input type="text" class="task-edit-input" data-id="${t.id}" value="${t.text.replace(/"/g, '&quot;')}" autocomplete="off" spellcheck="false" style="flex:1;" />
              <button class="task-del" data-act="saveEdit" data-id="${t.id}" style="color:#4ade80; opacity:1;">✓</button>
              <button class="task-del" data-act="cancelEdit" style="opacity:1;">✕</button>
              <select class="task-edit-priority" data-id="${t.id}" style="margin-left:23px;">
                ${Object.keys(PRIORITY_LABELS).map(p => `<option value="${p}" ${p === priority ? 'selected' : ''}>${p === 'none' ? 'No priority' : PRIORITY_LABELS[p]}</option>`).join('')}
              </select>
              <input type="date" class="task-edit-duedate" data-id="${t.id}" value="${t.dueDate || ''}" style="color-scheme: dark; flex: none; width: 128px;" />
            </div>
          `;
        }
        const dueBadge = t.dueDate && !t.done
          ? `<span style="font-size:10px; margin-left:6px; padding:1px 6px; border-radius:8px; ${t.dueDate < today ? 'color:#f87171; background:#3a1e1e;' : 'color:#888; background:#1e1e1e;'}">${formatDueDate(t.dueDate)}</span>`
          : '';
        return `
        <div class="task-row">
          <input type="checkbox" data-id="${t.id}" ${t.done ? 'checked' : ''} style="${checkboxColorVar}" />
          <div class="task-text${t.done ? ' done' : ''}" data-act="startEdit" data-id="${t.id}">${t.text.replace(/</g, '&lt;')}${dueBadge}</div>
          <button class="task-del" data-act="startEdit" data-id="${t.id}">✎</button>
          <button class="task-del" data-act="delete" data-id="${t.id}">✕</button>
        </div>
      `;
      }).join('');
      if (editingTaskId) {
        const input = listEl.querySelector('.task-edit-input');
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    }
    renderDailyTasksList = render;

    function startEditTask(id) {
      editingTaskId = id;
      render();
    }

    function cancelEditTask() {
      editingTaskId = null;
      render();
    }

    async function saveEditTask(id) {
      const input = listEl.querySelector(`.task-edit-input[data-id="${id}"]`);
      const priorityEl = listEl.querySelector(`.task-edit-priority[data-id="${id}"]`);
      const dueDateEl = listEl.querySelector(`.task-edit-duedate[data-id="${id}"]`);
      const text = input ? input.value.trim() : '';
      editingTaskId = null;
      if (!text) { render(); return; }
      const t = (tasksDataCache.dailyTasks || []).find(x => x.id === id);
      if (!t) { render(); return; }
      const newPriority = priorityEl ? priorityEl.value : (t.priority || 'none');
      const newDueDate = dueDateEl ? (dueDateEl.value || null) : (t.dueDate || null);
      if (t.text === text && (t.priority || 'none') === newPriority && (t.dueDate || null) === newDueDate) { render(); return; }
      t.text = text;
      t.priority = newPriority;
      t.dueDate = newDueDate;
      render();
      setStatus('Saving...', '');
      const ok = await saveTasksData(err => setStatus(`Error: ${err.message}`, 'error'));
      if (ok) setStatus('Saved ✓', 'success');
    }

    async function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasksDataCache.dailyTasks = tasksDataCache.dailyTasks || [];
      tasksDataCache.dailyTasks.unshift({
        id: tasksNewId(), text, done: false,
        priority: pendingPriority,
        dueDate: pendingDueDate,
      });
      taskInput.value = '';
      pendingPriority = 'none';
      pendingDueDate = null;
      dueDateInput.value = '';
      renderChips();
      render();
      setStatus('Saving...', '');
      const ok = await saveTasksData(err => setStatus(`Error: ${err.message}`, 'error'));
      if (ok) setStatus('Saved ✓', 'success');
    }

    async function clearCompletedTasks() {
      tasksDataCache.dailyTasks = (tasksDataCache.dailyTasks || []).filter(x => !x.done);
      render();
      setStatus('Saving...', '');
      const ok = await saveTasksData(err => setStatus(`Error: ${err.message}`, 'error'));
      if (ok) setStatus('Saved ✓', 'success');
    }

    async function toggleTask(id) {
      const t = (tasksDataCache.dailyTasks || []).find(x => x.id === id);
      if (!t) return;
      t.done = !t.done;
      render();
      setStatus('Saving...', '');
      const ok = await saveTasksData(err => setStatus(`Error: ${err.message}`, 'error'));
      if (ok) setStatus('Saved ✓', 'success');
    }

    async function deleteTask(id) {
      tasksDataCache.dailyTasks = (tasksDataCache.dailyTasks || []).filter(x => x.id !== id);
      render();
      setStatus('Saving...', '');
      const ok = await saveTasksData(err => setStatus(`Error: ${err.message}`, 'error'));
      if (ok) setStatus('Saved ✓', 'success');
    }

    card.addEventListener('click', (e) => {
      const target = e.target.closest('[data-act]');
      const act = target?.dataset.act;
      if (act === 'add') addTask();
      else if (act === 'refresh') initTasksData();
      else if (act === 'toggleConfig') configPanel.classList.toggle('open');
      else if (act === 'delete') deleteTask(target.dataset.id);
      else if (act === 'startEdit') startEditTask(target.dataset.id);
      else if (act === 'saveEdit') saveEditTask(target.dataset.id);
      else if (act === 'cancelEdit') cancelEditTask();
      else if (act === 'clearCompleted') clearCompletedTasks();
      else if (act === 'toggleDueMenu') {
        const willOpen = dueMenu.hidden;
        closeMenus();
        if (willOpen) { dueMenu.hidden = false; dueBtn.classList.add('active'); }
        e.stopPropagation();
      }
      else if (act === 'togglePriorityMenu') {
        const willOpen = priorityMenu.hidden;
        closeMenus();
        if (willOpen) { priorityMenu.hidden = false; priorityBtn.classList.add('active'); }
        e.stopPropagation();
      }
      else if (act === 'setDue') {
        pendingDueDate = target.dataset.value;
        closeMenus();
        renderChips();
      }
      else if (act === 'pickDate') {
        closeMenus();
        dueDateInput.style.display = '';
        if (dueDateInput.showPicker) dueDateInput.showPicker(); else dueDateInput.focus();
      }
      else if (act === 'setPriority') {
        pendingPriority = target.dataset.value;
        closeMenus();
        renderChips();
      }
      else if (act === 'clearDue') { pendingDueDate = null; renderChips(); }
      else if (act === 'clearPriority') { pendingPriority = 'none'; renderChips(); }
      else if (act === 'saveToken') {
        const val = tokenInput.value.trim();
        if (!val) return;
        localStorage.setItem(TASKS_GITHUB_TOKEN_STORAGE, val);
        setStatus('Token saved ✓', 'success');
        initTasksData();
      }
    });
    document.addEventListener('click', (e) => {
      if (!card.contains(e.target)) closeMenus();
    });
    dueDateInput.addEventListener('change', () => {
      pendingDueDate = dueDateInput.value || null;
      dueDateInput.style.display = 'none';
      renderChips();
    });
    card.addEventListener('change', (e) => {
      if (e.target.matches('input[type="checkbox"][data-id]')) toggleTask(e.target.dataset.id);
    });
    card.addEventListener('keydown', (e) => {
      if (!e.target.matches('.task-edit-input')) return;
      if (e.key === 'Enter') saveEditTask(e.target.dataset.id);
      else if (e.key === 'Escape') cancelEditTask();
    });
    taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

    const savedToken = localStorage.getItem(TASKS_GITHUB_TOKEN_STORAGE) || '';
    if (savedToken) tokenInput.value = savedToken;
    else configPanel.classList.add('open');

    return card;
  }

  const GOAL_TIMEFRAMES = ['3 months', '6 months', '1 year', 'Long-term'];
  const GOAL_STATUSES = [
    { value: 'not_started', label: 'Not started' },
    { value: 'in_progress', label: 'In progress' },
    { value: 'done', label: 'Done' },
  ];

  function buildGoalsCard() {
    const card = document.createElement('div');
    card.className = 'tool-card task-card-accent';
    card.style.setProperty('--task-accent-color', '#c77adf');
    card.innerHTML = `
      <div class="tool-hd">
        <div class="tool-name">🎯 Goals</div>
        <div class="tool-actions">
          <button class="icon-btn" data-act="refresh">↻ Refresh</button>
        </div>
      </div>
      <div class="tool-desc">Your goal board — grouped by timeframe. Uses the same GitHub token as Daily Tasks.</div>
      <div class="status-line" data-el="status"></div>
      <div class="id-row" style="margin-bottom:8px;">
        <input type="text" data-el="titleInput" placeholder="Goal title..." autocomplete="off" spellcheck="false" />
      </div>
      <div class="id-row" style="margin-bottom:8px;">
        <select data-el="timeframeInput">${GOAL_TIMEFRAMES.map(t => `<option value="${t}">${t}</option>`).join('')}</select>
        <select data-el="statusInput">${GOAL_STATUSES.map(s => `<option value="${s.value}">${s.label}</option>`).join('')}</select>
      </div>
      <div class="id-row" style="margin-bottom:8px;">
        <input type="text" data-el="notesInput" placeholder="Notes (optional)" autocomplete="off" spellcheck="false" />
        <button class="save-btn" data-act="add">Add goal</button>
      </div>
      <div data-el="list"></div>
    `;

    const el = sel => card.querySelector(`[data-el="${sel}"]`);
    const statusEl = el('status');
    const titleInput = el('titleInput');
    const timeframeInput = el('timeframeInput');
    const statusInput = el('statusInput');
    const notesInput = el('notesInput');
    const listEl = el('list');

    function setStatus(text, cls) {
      statusEl.className = `status-line ${cls || ''}`;
      statusEl.innerHTML = text ? `<span class="status-dot ${cls || ''}"></span>${text}` : '';
    }
    setGoalsStatus = setStatus;

    let editingGoalId = null;

    function render() {
      const goals = tasksDataCache.goals || [];
      if (goals.length === 0) { listEl.innerHTML = ''; return; }
      const statusLabel = v => GOAL_STATUSES.find(s => s.value === v)?.label || v;
      listEl.innerHTML = GOAL_TIMEFRAMES
        .map((tf, tfIndex) => {
          const inGroup = goals.filter(g => g.timeframe === tf);
          // Done goals sink to the bottom of their timeframe group, same
          // as Daily Tasks — stable partition, not a re-sort within groups.
          const items = [...inGroup.filter(g => g.status !== 'done'), ...inGroup.filter(g => g.status === 'done')];
          return { tf, tfIndex, items };
        })
        .filter(g => g.items.length > 0)
        .map(({ tf, tfIndex, items }) => `
          <div class="goal-group-label tf-${tfIndex}">${tf}</div>
          ${items.map(g => {
            if (g.id === editingGoalId) {
              return `
                <div class="proof-item" style="margin-bottom:8px;">
                  <div class="id-row" style="margin-bottom:6px;">
                    <input type="text" class="goal-edit-title" data-id="${g.id}" value="${g.title.replace(/"/g, '&quot;')}" autocomplete="off" spellcheck="false" />
                  </div>
                  <div class="id-row" style="margin-bottom:6px;">
                    <select class="goal-edit-timeframe" data-id="${g.id}">${GOAL_TIMEFRAMES.map(t => `<option value="${t}" ${t === g.timeframe ? 'selected' : ''}>${t}</option>`).join('')}</select>
                  </div>
                  <div class="id-row" style="margin-bottom:6px;">
                    <input type="text" class="goal-edit-notes" data-id="${g.id}" value="${(g.notes || '').replace(/"/g, '&quot;')}" placeholder="Notes (optional)" autocomplete="off" spellcheck="false" />
                  </div>
                  <div class="id-row">
                    <button class="save-btn" data-act="saveEditGoal" data-id="${g.id}">✓ Save</button>
                    <button class="save-btn" data-act="cancelEditGoal">✕ Cancel</button>
                  </div>
                </div>
              `;
            }
            return `
            <div class="proof-item" style="margin-bottom:8px;">
              <div class="proof-name" style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                <span data-act="startEditGoal" data-id="${g.id}" style="cursor:pointer;">${g.title.replace(/</g, '&lt;')}</span>
                <button class="goal-status ${g.status}" data-act="cycleStatus" data-id="${g.id}">${statusLabel(g.status)}</button>
              </div>
              ${g.notes ? `<div class="proof-diff" style="margin-top:4px;">${g.notes.replace(/</g, '&lt;')}</div>` : ''}
              <div style="display:flex; gap:12px; margin-top:4px;">
                <button class="task-del" data-act="startEditGoal" data-id="${g.id}">✎ Edit</button>
                <button class="task-del" data-act="delete" data-id="${g.id}">🗑 Delete</button>
              </div>
            </div>
          `;
          }).join('')}
        `).join('');
    }
    renderGoalsList = render;

    function startEditGoal(id) {
      editingGoalId = id;
      render();
    }

    function cancelEditGoal() {
      editingGoalId = null;
      render();
    }

    async function saveEditGoal(id) {
      const titleInputEl = listEl.querySelector(`.goal-edit-title[data-id="${id}"]`);
      const timeframeInputEl = listEl.querySelector(`.goal-edit-timeframe[data-id="${id}"]`);
      const notesInputEl = listEl.querySelector(`.goal-edit-notes[data-id="${id}"]`);
      const title = titleInputEl ? titleInputEl.value.trim() : '';
      editingGoalId = null;
      if (!title) { render(); return; }
      const g = (tasksDataCache.goals || []).find(x => x.id === id);
      if (!g) { render(); return; }
      g.title = title;
      g.timeframe = timeframeInputEl ? timeframeInputEl.value : g.timeframe;
      g.notes = notesInputEl ? notesInputEl.value.trim() : g.notes;
      render();
      setStatus('Saving...', '');
      const ok = await saveTasksData(err => setStatus(`Error: ${err.message}`, 'error'));
      if (ok) setStatus('Saved ✓', 'success');
    }

    async function addGoal() {
      const title = titleInput.value.trim();
      if (!title) return;
      tasksDataCache.goals = tasksDataCache.goals || [];
      tasksDataCache.goals.push({
        id: tasksNewId(), title,
        timeframe: timeframeInput.value,
        status: statusInput.value,
        notes: notesInput.value.trim(),
      });
      titleInput.value = '';
      notesInput.value = '';
      render();
      setStatus('Saving...', '');
      const ok = await saveTasksData(err => setStatus(`Error: ${err.message}`, 'error'));
      if (ok) setStatus('Saved ✓', 'success');
    }

    async function cycleStatus(id) {
      const g = (tasksDataCache.goals || []).find(x => x.id === id);
      if (!g) return;
      const idx = GOAL_STATUSES.findIndex(s => s.value === g.status);
      g.status = GOAL_STATUSES[(idx + 1) % GOAL_STATUSES.length].value;
      render();
      setStatus('Saving...', '');
      const ok = await saveTasksData(err => setStatus(`Error: ${err.message}`, 'error'));
      if (ok) setStatus('Saved ✓', 'success');
    }

    async function deleteGoal(id) {
      tasksDataCache.goals = (tasksDataCache.goals || []).filter(x => x.id !== id);
      render();
      setStatus('Saving...', '');
      const ok = await saveTasksData(err => setStatus(`Error: ${err.message}`, 'error'));
      if (ok) setStatus('Saved ✓', 'success');
    }

    card.addEventListener('click', (e) => {
      const act = e.target.dataset.act;
      if (act === 'add') addGoal();
      else if (act === 'refresh') initTasksData();
      else if (act === 'cycleStatus') cycleStatus(e.target.dataset.id);
      else if (act === 'delete') deleteGoal(e.target.dataset.id);
      else if (act === 'startEditGoal') startEditGoal(e.target.dataset.id);
      else if (act === 'saveEditGoal') saveEditGoal(e.target.dataset.id);
      else if (act === 'cancelEditGoal') cancelEditGoal();
    });
    titleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addGoal(); });
    listEl.addEventListener('keydown', (e) => {
      if (!e.target.matches('.goal-edit-title, .goal-edit-notes')) return;
      if (e.key === 'Enter') saveEditGoal(e.target.dataset.id);
      else if (e.key === 'Escape') cancelEditGoal();
    });

    return card;
  }

  cardsTasksRoot.appendChild(buildDailyTasksCard());
  cardsTasksRoot.appendChild(buildGoalsCard());
  initTasksData();
</script>
</body>
</html>
