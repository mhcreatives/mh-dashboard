      statusEl.className = `status-line ${cls || ''}`;
      statusEl.innerHTML = text ? `<span class="status-dot ${cls || ''}"></span>${text}` : '';
    }

    function renderResults(flagged) {
      if (flagged.length === 0) {
        resultsEl.innerHTML = '';
        return;
      }
      resultsEl.innerHTML = flagged.map(f => {
        let actionHtml = '';
        if (f.reason === 'Shipping details is empty') {
          if (!f.psid) {
            actionHtml = `<div class="proof-diff">No PSID on record — cannot check conversation</div>`;
          } else if (!f.checked) {
            actionHtml = `<button class="icon-btn" data-act="checkConvo" data-id="${f.id}" style="margin-top:6px;">🔍 Check conversation</button>`;
          } else if (f.userReply) {
            actionHtml = `
              <div class="proof-diff" style="color:#4ade80;">Client already replied with shipping details:</div>
              <div style="white-space:pre-wrap; font-size:10px; color:#ccc; background:#111; border-radius:6px; padding:8px; margin-top:4px; font-family:'DM Mono',monospace;">${f.userReply.replace(/</g, '&lt;')}</div>
              ${f.filled
                ? `<div class="proof-diff" style="color:#4ade80;">Shipping details field updated ✓</div>`
                : `<button class="icon-btn" data-act="fillFromReply" data-id="${f.id}" style="margin-top:6px;">✅ Approve update to Airtable</button>`}
            `;
          } else if (f.pageSent) {
            actionHtml = `
              <div class="proof-diff">Form already sent — no reply yet</div>
              <button class="icon-btn" data-act="sendForm" data-id="${f.id}" style="margin-top:6px;">✉ Send form again</button>
            `;
          } else {
            actionHtml = `<button class="icon-btn" data-act="sendForm" data-id="${f.id}" style="margin-top:6px;">✉ Send form</button>`;
          }
        }
        return `
          <div class="proof-item">
            <div class="proof-name">${f.name}${f.clientNum ? ` <span>#${f.clientNum}</span>` : ''}</div>
            <div class="proof-diff">${f.reason}</div>
            ${actionHtml}
            <div style="display:flex; gap:12px; margin-top:6px;">
              ${f.metaLink ? `<a class="proof-link" href="${f.metaLink}" target="_blank" rel="noopener">Open conversation ↗</a>` : ''}
              <a class="proof-link" href="https://airtable.com/${OT_BASE_ID}/${INV_TABLE}/${f.id}" target="_blank" rel="noopener">Open record ↗</a>
            </div>
          </div>
        `;
      }).join('');
    }

    async function scan() {
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      if (!apiKey) {
        setStatus('Set Airtable API key in Order Tracker first ↓', 'error');
        return;
      }

      setStatus('Scanning...', '');
      summaryEl.textContent = '';
      resultsEl.innerHTML = '';

      try {
        const records = await otFetchRecords(
          apiKey, INV_TABLE, INV_STATUS, SHIP_DETAILS, SHIP_DETAILS,
          `{Status}="For packaging"`,
          [PROOF_FB_NAME, PROOF_CLIENT_NUM, SHIP_PSID, META_LINK]
        );

        const flagged = [];
        let ok = 0;
        records.forEach(r => {
          const name = r.fields?.[PROOF_FB_NAME] || 'Unnamed';
          const clientNum = r.fields?.[PROOF_CLIENT_NUM];
          const psid = r.fields?.[SHIP_PSID];
          const metaLink = r.fields?.[META_LINK];
          const details = r.fields?.[SHIP_DETAILS];
          if (!details || !details.trim()) {
            flagged.push({ id: r.id, name, clientNum, psid, metaLink, reason: 'Shipping details is empty' });
            return;
          }
          if (!otHasPhoneNumber(details)) {
            flagged.push({ id: r.id, name, clientNum, psid, metaLink, reason: 'No phone number found in Shipping details' });
            return;
          }
          ok++;
        });

        lastFlagged = flagged;
        summaryEl.textContent = `${records.length} scanned · ${flagged.length} flagged · ${ok} ok`;
        setStatus(flagged.length ? `${flagged.length} flagged` : 'All good ✓', flagged.length ? 'error' : 'success');
        renderResults(flagged);

        // Automatically check each flagged-empty record's conversation, so you
        // don't have to click "Check conversation" one by one.
        const { pageId, pageToken } = getFbCreds();
        const toCheck = flagged.filter(f => f.reason === 'Shipping details is empty' && f.psid);
        if (pageId && pageToken && toCheck.length > 0) {
          for (let i = 0; i < toCheck.length; i++) {
            const item = toCheck[i];
            setStatus(`Checking conversation ${i + 1}/${toCheck.length}: ${item.name}...`, '');
            try {
              const state = await otCheckConversationState(pageId, pageToken, item.psid);
              item.checked = true;
              item.pageSent = state.pageSent;
              item.userReply = state.userReply;
            } catch (err) {
              item.checkError = err.message;
            }
            renderResults(lastFlagged);
          }
          const withReply = toCheck.filter(f => f.userReply).length;
          setStatus(`Done — ${flagged.length} flagged, ${withReply} with a reply ready to approve`, withReply ? 'success' : '');
        } else if (toCheck.length > 0 && (!pageId || !pageToken)) {
          setStatus(`${flagged.length} flagged — set Facebook Page credentials ↓ to auto-check conversations`, 'error');
        }
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    function getFbCreds() {
      return {
        pageId: localStorage.getItem(FB_PAGE_ID_STORAGE) || '',
        pageToken: localStorage.getItem(FB_PAGE_TOKEN_STORAGE) || '',
      };
    }

    async function checkConversation(item) {
      const { pageId, pageToken } = getFbCreds();
      if (!pageId || !pageToken) {
        setStatus('Set Facebook Page credentials first ↓', 'error');
        configPanel.classList.add('open');
        return;
      }
      if (!item.psid) {
        setStatus('This record has no PSID — cannot check', 'error');
        return;
      }
      setStatus(`Checking conversation for ${item.name}...`, '');
      try {
        const state = await otCheckConversationState(pageId, pageToken, item.psid);
        item.checked = true;
        item.pageSent = state.pageSent;
        item.userReply = state.userReply;
        setStatus(
          item.userReply ? `Found a filled-out reply from ${item.name} — review and approve below`
          : item.pageSent ? `Form already sent to ${item.name} — no reply yet`
          : `No prior form/reply found for ${item.name}`,
          item.userReply ? 'success' : ''
        );
        renderResults(lastFlagged);
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    async function sendShippingForm(item) {
      const { pageId, pageToken } = getFbCreds();
      if (!pageId || !pageToken) {
        setStatus('Set Facebook Page credentials first ↓', 'error');
        configPanel.classList.add('open');
        return;
      }
      const ok = confirm(`Send the shipping details request to ${item.name} via Messenger?`);
      if (!ok) return;

      setStatus(`Sending form to ${item.name}...`, '');
      try {
        await otSendMessengerMessage(pageId, pageToken, item.psid, SHIPPING_FORM_TEMPLATE);
        item.pageSent = true;
        setStatus(`Form sent to ${item.name} ✓`, 'success');
        renderResults(lastFlagged);
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    async function fillFromReply(item) {
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      if (!apiKey) {
        setStatus('Set Airtable API key in Order Tracker first ↓', 'error');
        return;
      }
      if (!item.userReply) return;

      setStatus(`Updating Shipping details for ${item.name}...`, '');
      try {
        await otPatchRecords(apiKey, INV_TABLE, [{ id: item.id, fields: { 'Shipping details': item.userReply } }]);
        item.filled = true;
        setStatus(`Shipping details updated for ${item.name} ✓`, 'success');
        renderResults(lastFlagged);
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    card.addEventListener('click', (e) => {
      const act = e.target.dataset.act;
      if (act === 'scan') {
        scan();
      } else if (act === 'toggleConfig') {
        configPanel.classList.toggle('open');
      } else if (act === 'saveFbCreds') {
        const pageId = pageIdInput.value.trim();
        const pageToken = pageTokenInput.value.trim();
        if (!pageId || !pageToken) return;
        localStorage.setItem(FB_PAGE_ID_STORAGE, pageId);
        localStorage.setItem(FB_PAGE_TOKEN_STORAGE, pageToken);
        setStatus('Facebook Page credentials saved ✓', 'success');
      } else if (act === 'checkConvo') {
        const item = lastFlagged.find(f => f.id === e.target.dataset.id);
        if (item) checkConversation(item);
      } else if (act === 'sendForm') {
        const item = lastFlagged.find(f => f.id === e.target.dataset.id);
        if (item) sendShippingForm(item);
      } else if (act === 'fillFromReply') {
        const item = lastFlagged.find(f => f.id === e.target.dataset.id);
        if (item) fillFromReply(item);
      } else if (act === 'sendTrackStart') {
        startSendTracking();
      } else if (act === 'sendTrackStop') {
        if (stopTracking) stopTracking();
        setTrackStatus('Stopping after current record...', '');
      } else if (act === 'toggleExtConfig') {
        extConfigPanel.classList.toggle('open');
      } else if (act === 'saveExtId') {
        const val = extIdInput.value.trim();
        if (!val) return;
        localStorage.setItem(PROOF_EXT_ID_STORAGE, val);
        setTrackStatus('Extension ID saved ✓', 'success');
      }
    });

    const savedExtId = localStorage.getItem(PROOF_EXT_ID_STORAGE) || '';
    if (savedExtId) extIdInput.value = savedExtId;

    const savedPageId = localStorage.getItem(FB_PAGE_ID_STORAGE) || '';
    const savedPageToken = localStorage.getItem(FB_PAGE_TOKEN_STORAGE) || '';
    if (savedPageId) pageIdInput.value = savedPageId;
    if (savedPageToken) pageTokenInput.value = savedPageToken;

    return card;
  }

  // ─── Balance Checker ─────────────────────────────────────────────────────
  // "For packaging" status records with Balance paid unchecked: shows the
  // pending balance, auto-checks the conversation for a receipt attachment,
  // and lets you confirm payment received — which sends a confirmation
  // message and checks the Balance paid field.

  const BAL_PAID_FIELD = 'fld5HsidilUatx1om';
  const ADDITIONAL_ORDER_FIELD = 'fldCd5SsYHRSu0xBf';
  const PAYMENT_RECEIVED_MESSAGE = 'Payment received po 😊 Sched na po namin ito for shipping, magsend nalang po kami ng tracking number. Thank you po!';

  function buildBalanceCard() {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.innerHTML = `
      <div class="tool-hd">
        <div class="tool-name">💰 Balance</div>
        <div class="tool-actions">
          <button class="icon-btn" data-act="scan">▶ Scan</button>
        </div>
      </div>
      <div class="tool-desc">"For packaging" orders with Balance not yet paid — checks for a receipt in Messenger.</div>
      <div class="status-line" data-el="status"></div>
      <div class="proof-summary" data-el="summary"></div>
      <div class="id-row" style="margin-bottom:8px;">
        <input type="text" inputmode="decimal" data-el="balanceFindInput" placeholder="Amount received (e.g. 1360) — highlights matching balance" autocomplete="off" spellcheck="false" />
      </div>
      <div class="status-line" data-el="balanceFindStatus"></div>
      <div class="proof-results" data-el="results"></div>

      <div class="config-toggle" data-act="toggleConfig">⚙ set facebook page credentials</div>
      <div class="config-panel" data-el="configPanel">
        <div class="config-hint">
          Facebook <b>Page ID</b> and <b>Page access token</b> — same credentials as the Shipping card. Stored locally in this browser only.
        </div>
        <div class="id-row">
          <input type="text" data-el="pageIdInput" placeholder="Page ID" autocomplete="off" spellcheck="false" />
        </div>
        <div class="id-row" style="margin-top:8px;">
          <input type="password" data-el="pageTokenInput" placeholder="Page access token" autocomplete="off" spellcheck="false" />
          <button class="save-btn" data-act="saveFbCreds">Save</button>
        </div>
        <div class="config-hint" style="margin-top:12px;">
          <b>Gemini API key</b> (optional) — lets it read the receipt image and extract the amount + payment type.
        </div>
        <div class="id-row">
          <input type="password" data-el="geminiKeyInput" placeholder="Gemini API key" autocomplete="off" spellcheck="false" />
          <button class="save-btn" data-act="saveGeminiKey">Save</button>
        </div>
      </div>

      <div class="ot-divider" style="margin:14px 0;"></div>
      <div class="tool-name" style="font-size:12px;">🔎 PSID Finder</div>
      <div class="tool-desc" style="margin-top:2px;">Searches your Page's conversations by client name, verifies the match, and lets you save the resolved PSID to the record.</div>
      <div class="status-line" data-el="psidStatus"></div>
      <div class="id-row" style="margin-top:8px;">
        <input type="text" data-el="psidSearchInput" placeholder="Client name or number" autocomplete="off" spellcheck="false" />
        <button class="save-btn" data-act="psidResolve">Find PSID</button>
      </div>
      <div class="proof-results" data-el="psidResults"></div>
    `;

    const el = sel => card.querySelector(`[data-el="${sel}"]`);
    const statusEl = el('status');
    const summaryEl = el('summary');
    const resultsEl = el('results');
    const configPanel = el('configPanel');
    const pageIdInput = el('pageIdInput');
    const pageTokenInput = el('pageTokenInput');
    const geminiKeyInput = el('geminiKeyInput');
    const balanceFindInput = el('balanceFindInput');
    const balanceFindStatusEl = el('balanceFindStatus');
    const psidStatusEl = el('psidStatus');
    const psidSearchInput = el('psidSearchInput');
    const psidResultsEl = el('psidResults');

    let lastFlagged = [];
    let lastPsidResult = null;

    function setPsidStatus(text, cls) {
      psidStatusEl.className = `status-line ${cls || ''}`;
      psidStatusEl.innerHTML = text ? `<span class="status-dot ${cls || ''}"></span>${text}` : '';
    }

    async function resolvePsid() {
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      const { pageId, pageToken } = getFbCreds();
      if (!apiKey) { setPsidStatus('Set Airtable API key in Order Tracker first', 'error'); return; }
      if (!pageId || !pageToken) { setPsidStatus('Set Facebook Page credentials above first', 'error'); configPanel.classList.add('open'); return; }

      const search = psidSearchInput.value.trim();
      if (!search) { setPsidStatus('Enter a client name or number', 'error'); return; }

      psidResultsEl.innerHTML = '';
      setPsidStatus('Looking up record...', '');
      try {
        const isNumber = /^\d+$/.test(search);
        const filter = isNumber ? `{Client Number}=${search}` : `SEARCH(LOWER("${search.replace(/"/g, '\\"')}"),LOWER({FB Name}))`;
        const records = await otFetchRecords(apiKey, INV_TABLE, INV_STATUS, PROOF_FB_NAME, PROOF_CLIENT_NUM, filter, [SHIP_PSID]);
        if (records.length === 0) { setPsidStatus(`No record found matching "${search}"`, 'error'); return; }
        if (records.length > 1) {
          const names = records.map(r => `${r.fields?.[PROOF_FB_NAME] || 'Unnamed'} (#${r.fields?.[PROOF_CLIENT_NUM] || '?'})`);
          psidResultsEl.innerHTML = `
            <div class="proof-item">
              <div class="proof-diff">${records.length} records matched "${search}" — search by client number instead, or add more of the name, to narrow it down:</div>
              <div class="proof-diff">${names.map(n => `• ${n}`).join('<br>')}</div>
            </div>
          `;
          setPsidStatus(`${records.length} records matched "${search}" — be more specific`, 'error');
          return;
        }
        const record = records[0];
        const recordName = record.fields?.[PROOF_FB_NAME] || 'Unnamed';
        const currentPsid = record.fields?.[SHIP_PSID] || null;

        setPsidStatus(`Searching conversations for "${recordName}"... this may take a moment`, '');
        const { participant, checked, ambiguous } = await otFindConversationByParticipantName(
          pageId, pageToken, recordName,
          (n) => setPsidStatus(`Searching conversations for "${recordName}"... ${n} checked so far`, '')
        );

        if (ambiguous) {
          setPsidStatus(`Checked ${checked} conversation(s) — multiple equally-likely name matches for "${recordName}", can't pick one automatically. Check Messenger manually.`, 'error');
          return;
        }
        if (!participant) {
          setPsidStatus(`Checked ${checked} conversation(s) — no match found for "${recordName}"`, 'error');
          return;
        }

        const candidateId = participant.id;
        const participantName = participant.name;
        lastPsidResult = { recordId: record.id, recordName, candidateId, participantName, currentPsid };

        psidResultsEl.innerHTML = `
          <div class="proof-item">
            <div class="proof-name">Record: ${recordName}</div>
            <div class="proof-diff">Matched conversation participant: <b>${participantName}</b> (checked ${checked} conversation(s))</div>
            ${currentPsid ? `<div class="proof-diff">Current PSID on record: ${currentPsid}${currentPsid === candidateId ? ' (same as resolved)' : ''}</div>` : `<div class="proof-diff">No PSID currently on record</div>`}
            <div class="proof-diff">Resolved PSID: ${candidateId}</div>
            <button class="icon-btn" data-act="psidSave" style="margin-top:6px;">✓ Save this PSID to the record</button>
          </div>
        `;
        setPsidStatus('Resolved — review before saving', 'success');
      } catch (err) {
        setPsidStatus(`Error: ${err.message}`, 'error');
      }
    }

    async function savePsid() {
      if (!lastPsidResult) return;
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      setPsidStatus(`Saving PSID for ${lastPsidResult.recordName}...`, '');
      try {
        await otPatchRecords(apiKey, INV_TABLE, [{ id: lastPsidResult.recordId, fields: { 'PSID': lastPsidResult.candidateId } }]);
        setPsidStatus(`PSID saved for ${lastPsidResult.recordName} ✓`, 'success');
      } catch (err) {
        setPsidStatus(`Error: ${err.message}`, 'error');
      }
    }

    function setStatus(text, cls) {
      statusEl.className = `status-line ${cls || ''}`;
      statusEl.innerHTML = text ? `<span class="status-dot ${cls || ''}"></span>${text}` : '';
    }

    function getFbCreds() {
      return {
        pageId: localStorage.getItem(FB_PAGE_ID_STORAGE) || '',
        pageToken: localStorage.getItem(FB_PAGE_TOKEN_STORAGE) || '',
      };
    }

    function renderResults(flagged) {
      if (flagged.length === 0) {
        resultsEl.innerHTML = '';
        return;
      }
      // Records with a confirmed receipt first, so the ones ready for you to
      // action (click Payment Received) don't get buried below everyone else.
      const sorted = flagged.slice().sort((a, b) => {
        const aHasReceipt = a.analysis?.isReceipt === true ? 1 : 0;
        const bHasReceipt = b.analysis?.isReceipt === true ? 1 : 0;
        return bHasReceipt - aHasReceipt;
      });
      resultsEl.innerHTML = sorted.map(f => {
        if (f.autoPaid || f.autoPaidError) {
          return `
          <div class="proof-item" data-balance="0">
            <div class="proof-name">${f.name}${f.clientNum ? ` <span>#${f.clientNum}</span>` : ''}</div>
            ${f.autoPaid
              ? `<div class="proof-diff" style="color:#4ade80;">Balance was ₱0 — automatically marked as paid ✓</div>`
              : `<div class="proof-diff">Balance is ₱0 but auto-update failed: ${f.autoPaidError}</div>`}
            <div style="display:flex; gap:12px; margin-top:6px;">
              ${f.metaLink ? `<a class="proof-link" href="${f.metaLink}" target="_blank" rel="noopener">Open conversation ↗</a>` : ''}
              <a class="proof-link" href="https://airtable.com/${OT_BASE_ID}/${INV_TABLE}/${f.id}" target="_blank" rel="noopener">Open record ↗</a>
            </div>
          </div>
          `;
        }
        let analysisHtml = '';
        if (f.analysis && f.analysis.isReceipt === false) {
          analysisHtml = `
            <div class="proof-diff">Not a receipt — checked attachment(s) don't look like proof of payment</div>
            ${f.receiptImageUrl ? `<img src="${f.receiptImageUrl}" alt="Attachment" style="max-width:100%; border-radius:8px; margin-top:6px; display:block; opacity:0.7;" />` : ''}`;
        } else if (f.analysis) {
          const mismatch = typeof f.analysis.amount === 'number' && Math.abs(f.analysis.amount - f.balance) >= 1;
          const dest = f.analysis.recipientDestination || f.analysis.recipientName
            ? ` · Sent to ${[f.analysis.recipientDestination, f.analysis.recipientName].filter(Boolean).join(' — ')}`
            : '';
          const ts = f.analysis.timestamp ? ` · ${f.analysis.timestamp}` : '';
          const isUnknownType = !f.analysis.type || f.analysis.type.toLowerCase() === 'unknown';
          analysisHtml = `
            <div class="proof-diff" style="color:${mismatch ? '#f87171' : '#4ade80'};">
              ${f.analysis.type || 'Receipt'}${f.analysis.amount != null ? `: ${otFormatPeso(f.analysis.amount)}` : ''}${f.analysis.refNo ? ` · Ref# ${f.analysis.refNo}` : ''}${dest}${ts}
              ${mismatch ? ` ⚠ doesn't match balance due (${otFormatPeso(f.balance)})` : ''}
            </div>
            ${isUnknownType && f.receiptImageUrl
              ? `<img src="${f.receiptImageUrl}" alt="Receipt" style="max-width:100%; border-radius:8px; margin-top:6px; display:block;" />`
              : ''}`;
        } else if (f.analysisError) {
          analysisHtml = `
            <div class="proof-diff">Could not read receipt: ${f.analysisError}</div>
            ${f.receiptImageUrl ? `<img src="${f.receiptImageUrl}" alt="Receipt" style="max-width:100%; border-radius:8px; margin-top:6px; display:block;" />` : ''}`;
        }
        let debugHtml = '';
        if (f.debugInfo) {
          const safeJson = v => (JSON.stringify(v, null, 2) || 'undefined').replace(/</g, '&lt;');
          const body = f.debugInfo.nearMisses !== undefined
            ? `Anchor not found. Page messages mentioning "balance"/"mapaship":\n${safeJson(f.debugInfo.nearMisses)}`
            : `${f.debugInfo.candidateMessageCount} message(s) after anchor (within ${RECEIPT_WINDOW_HOURS}h window), ${f.debugInfo.clientMessageCount} from client, ${f.debugInfo.clientAttachmentCount} attachment(s) total:\nanchor: ${safeJson(f.debugInfo.anchorMessage)} @ ${f.debugInfo.anchorTime}${f.debugInfo.anchorAmountUnverified ? ' ⚠ (amount in message didn\'t match current balance field — used anyway, only candidate)' : ''}\ncandidateTimes: ${safeJson(f.debugInfo.candidateTimes)}${f.debugInfo.rawAttachments !== undefined ? `\nrawAttachments: ${safeJson(f.debugInfo.rawAttachments)}` : ''}${f.debugInfo.lateClientMessageCount ? `\n⚠ ${f.debugInfo.lateClientMessageCount} client message(s) AFTER the ${RECEIPT_WINDOW_HOURS}h window (${f.debugInfo.lateClientAttachmentCount} with attachments) — window may be too short:\nlateClientMessageTimes: ${safeJson(f.debugInfo.lateClientMessageTimes)}` : ''}`;
          debugHtml = `
          <div style="white-space:pre-wrap; font-size:9px; color:#888; background:#111; border-radius:6px; padding:8px; margin-top:6px; font-family:'DM Mono',monospace; max-height:200px; overflow-y:auto;">DEBUG — ${body}</div>
        `;
        }
        return `
        <div class="proof-item" data-balance="${f.balance}">
          <div class="proof-name">${f.name}${f.clientNum ? ` <span>#${f.clientNum}</span>` : ''}</div>
          <div class="proof-diff">Balance pending: ${otFormatPeso(f.balance)}</div>
          <div class="proof-diff" style="color:${f.hasReceipt ? '#4ade80' : '#f87171'};">${f.receiptStatus}</div>
          ${analysisHtml}
          ${debugHtml}
          ${f.paid
            ? `<div class="proof-diff" style="color:#4ade80;">Marked as paid ✓</div>`
            : `<button class="icon-btn" data-act="markPaid" data-id="${f.id}" style="margin-top:6px;">✓ Payment Received</button>`}
          <div style="display:flex; gap:12px; margin-top:6px;">
            ${f.metaLink ? `<a class="proof-link" href="${f.metaLink}" target="_blank" rel="noopener">Open conversation ↗</a>` : ''}
            <a class="proof-link" href="https://airtable.com/${OT_BASE_ID}/${INV_TABLE}/${f.id}" target="_blank" rel="noopener">Open record ↗</a>
          </div>
        </div>
      `;
      }).join('');
      highlightBalanceMatches();
    }

    // Highlights every rendered record whose balance matches the typed
    // amount (within a peso of rounding tolerance, since receipts and
    // Airtable balances are both whole-peso in practice) — lets you type in
    // a payment amount you just received and instantly spot which client(s)
    // it belongs to, without reading through every "Balance pending" line.
    function highlightBalanceMatches() {
      const items = resultsEl.querySelectorAll('.proof-item[data-balance]');
      const raw = balanceFindInput.value.replace(/[^\d.]/g, '');
      const target = raw ? parseFloat(raw) : null;

      let matchCount = 0;
      items.forEach(item => {
        const balance = parseFloat(item.dataset.balance);
        const isMatch = target !== null && !isNaN(balance) && Math.abs(balance - target) < 1;
        item.classList.toggle('balance-match', isMatch);
        if (isMatch) matchCount++;
      });

      if (target === null) {
        balanceFindStatusEl.innerHTML = '';
      } else if (matchCount === 0) {
        balanceFindStatusEl.innerHTML = `<span class="status-dot error"></span>No matching balance found`;
        balanceFindStatusEl.className = 'status-line error';
      } else {
        balanceFindStatusEl.innerHTML = `<span class="status-dot success"></span>${matchCount} match${matchCount > 1 ? 'es' : ''} highlighted`;
        balanceFindStatusEl.className = 'status-line success';
        resultsEl.querySelector('.balance-match')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    async function scan() {
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      if (!apiKey) {
        setStatus('Set Airtable API key in Order Tracker first ↓', 'error');
        return;
      }

      setStatus('Scanning...', '');
      summaryEl.textContent = '';
      resultsEl.innerHTML = '';

      try {
        const records = await otFetchRecords(
          apiKey, INV_TABLE, INV_STATUS, PROOF_BALANCE, PROOF_BALANCE,
          `AND({Status}="For packaging",NOT({Balance paid}))`,
          [PROOF_FB_NAME, PROOF_CLIENT_NUM, SHIP_PSID, META_LINK, ADDITIONAL_ORDER_FIELD]
        );

        const { pageId, pageToken } = getFbCreds();
        const geminiKey = localStorage.getItem(GEMINI_KEY_STORAGE) || '';
        const canCheckReceipts = !!(pageId && pageToken);
        if (!canCheckReceipts) {
          setStatus('Scanned — set Facebook Page credentials ↓ to auto-check for receipts', '');
        }

        const flagged = [];
        let autoPaidCount = 0;
        for (const r of records) {
          const name = r.fields?.[PROOF_FB_NAME] || 'Unnamed';
          const clientNum = r.fields?.[PROOF_CLIENT_NUM];
          const psid = r.fields?.[SHIP_PSID];
          const metaLink = r.fields?.[META_LINK];
          const balance = r.fields?.[PROOF_BALANCE] ?? 0;
          const isAdditionalOrder = !!r.fields?.[ADDITIONAL_ORDER_FIELD];

          // Balance already zero and not a sub-order rolled into a parent's
          // balance — nothing to collect, so mark paid automatically instead
          // of asking for a receipt check / manual confirmation.
          if (balance === 0 && !isAdditionalOrder) {
            try {
              await otPatchRecords(apiKey, INV_TABLE, [{ id: r.id, fields: { 'Balance paid': true } }]);
              autoPaidCount++;
              flagged.push({ id: r.id, name, clientNum, metaLink, balance, autoPaid: true, paid: true });
            } catch (err) {
              flagged.push({ id: r.id, name, clientNum, metaLink, balance, autoPaidError: err.message });
            }
            continue;
          }

          let hasReceipt = false;
          let receiptStatus = 'Set Facebook Page credentials to check for a receipt';
          let analysis = null;
          let analysisError = null;
          let receiptImageUrl = null;
          let debugInfo = null;
          if (canCheckReceipts) {
            if (!psid) {
              receiptStatus = 'No PSID on record — cannot check conversation';
            } else {
              try {
                if (records.length > 1) setStatus(`Checking conversation for ${name}...`, '');
                const { messages, participantName } = await otFetchConversationMessages(pageId, pageToken, psid);

                // A stale/incorrect PSID silently returns a real but unrelated
                // conversation — no API error, just wrong data. Confirmed to
                // happen in practice. Catch it by comparing the conversation's
                // actual participant name against the record's stored name.
                const namesLookUnrelated = participantName && name && name !== 'Unnamed'
                  && !otNamesLooselyMatch(participantName, name);
                if (namesLookUnrelated) {
                  receiptStatus = `⚠ PSID may be wrong — conversation participant is "${participantName}", not "${name}"`;
                  flagged.push({ id: r.id, name, clientNum, psid, metaLink, balance, hasReceipt: false, receiptStatus, analysis: null, analysisError: null, receiptImageUrl: null, debugInfo: null });
                  continue;
                }

                const found = otFindReceiptCandidates(messages, psid, balance);
                debugInfo = found.debug;

                if (!found.anchorFound) {
                  receiptStatus = 'Balance request message not found in recent history — check conversation manually';
                } else if (found.candidates.length === 0) {
                  receiptStatus = 'Balance request found, but no attachment sent by client since then';
                } else if (!geminiKey) {
                  // Can't tell which candidate (if any) is a genuine receipt
                  // without vision analysis — surface the most recent one but
                  // flag it as unverified rather than asserting it's the receipt.
                  hasReceipt = true;
                  receiptStatus = `📎 ${found.candidates.length} attachment(s) found after balance request — set Gemini API key to verify which is the receipt`;
                  receiptImageUrl = found.candidates[0].imageUrl;
                } else {
                  let confirmed = null;
                  let lastAnalysis = null;
                  for (const candidate of found.candidates.slice(0, MAX_RECEIPT_CANDIDATES_TO_CHECK)) {
                    if (records.length > 1) setStatus(`Reading attachment for ${name}...`, '');
                    try {
                      const result = await otAnalyzeReceiptWithGemini(geminiKey, candidate.imageUrl);
                      lastAnalysis = result;
                      if (result.isReceipt) { confirmed = { candidate, result }; break; }
                    } catch (err) {
                      analysisError = err.message;
                    }
                  }
                  if (confirmed) {
                    hasReceipt = true;
                    receiptStatus = '📎 Receipt found (sent after balance request)';
                    receiptImageUrl = confirmed.candidate.imageUrl;
                    analysis = confirmed.result;
                  } else {
                    receiptStatus = `${found.candidates.length} attachment(s) found after balance request, but none look like a receipt (checked ${Math.min(found.candidates.length, MAX_RECEIPT_CANDIDATES_TO_CHECK)})`;
                    receiptImageUrl = found.candidates[0].imageUrl;
                    analysis = lastAnalysis;
                  }
                }
              } catch (err) {
                receiptStatus = `Could not check conversation: ${err.message}`;
              }
            }
          }

          flagged.push({ id: r.id, name, clientNum, psid, metaLink, balance, hasReceipt, receiptStatus, analysis, analysisError, receiptImageUrl, debugInfo });
        }

        lastFlagged = flagged;
        window.mhDebugBalance = { flagged, pageId, pageToken };
        summaryEl.textContent = `${records.length} scanned · ${autoPaidCount} auto-marked paid (₱0 balance) · ${flagged.filter(f => f.hasReceipt).length} with receipt found`;
        setStatus(flagged.length ? `${flagged.length} unpaid balance(s)` : 'No unpaid balances ✓', flagged.length ? '' : 'success');
        renderResults(flagged);
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    async function markPaid(item) {
      const { pageId, pageToken } = getFbCreds();
      if (!pageId || !pageToken) {
        setStatus('Set Facebook Page credentials first ↓', 'error');
        configPanel.classList.add('open');
        return;
      }
      if (!item.psid) {
        setStatus('This record has no PSID — cannot send confirmation', 'error');
        return;
      }
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      if (!apiKey) {
        setStatus('Set Airtable API key in Order Tracker first ↓', 'error');
        return;
      }
      setStatus(`Sending confirmation to ${item.name}...`, '');
      try {
        await otSendMessengerMessage(pageId, pageToken, item.psid, PAYMENT_RECEIVED_MESSAGE);
        setStatus(`Updating Balance paid for ${item.name}...`, '');
        await otPatchRecords(apiKey, INV_TABLE, [{ id: item.id, fields: { 'Balance paid': true } }]);
        lastFlagged = lastFlagged.filter(f => f.id !== item.id);
        setStatus(`${item.name} marked as paid ✓`, 'success');
        renderResults(lastFlagged);
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    card.addEventListener('click', (e) => {
      const act = e.target.dataset.act;
      if (act === 'scan') {
        scan();
      } else if (act === 'toggleConfig') {
        configPanel.classList.toggle('open');
      } else if (act === 'saveFbCreds') {
        const pageId = pageIdInput.value.trim();
        const pageToken = pageTokenInput.value.trim();
        if (!pageId || !pageToken) return;
        localStorage.setItem(FB_PAGE_ID_STORAGE, pageId);
        localStorage.setItem(FB_PAGE_TOKEN_STORAGE, pageToken);
        setStatus('Facebook Page credentials saved ✓', 'success');
      } else if (act === 'saveGeminiKey') {
        const geminiKey = geminiKeyInput.value.trim();
        if (!geminiKey) return;
        localStorage.setItem(GEMINI_KEY_STORAGE, geminiKey);
        setStatus('Gemini API key saved ✓', 'success');
      } else if (act === 'markPaid') {
        const item = lastFlagged.find(f => f.id === e.target.dataset.id);
        if (item) markPaid(item);
      } else if (act === 'psidResolve') {
        resolvePsid();
      } else if (act === 'psidSave') {
        savePsid();
      }
    });

    balanceFindInput.addEventListener('input', () => highlightBalanceMatches());

    const savedPageId = localStorage.getItem(FB_PAGE_ID_STORAGE) || '';
    const savedPageToken = localStorage.getItem(FB_PAGE_TOKEN_STORAGE) || '';

  // ─── PSID Finder ─────────────────────────────────────────────────────────
  // Resolves and VERIFIES a PSID by searching the Page's own conversation
  // list for a participant whose name matches the client — the conversation
  // URL's "selected_item_id" turned out NOT to be a usable PSID (confirmed:
  // querying it directly returns a Graph API error), so this searches by
  // name instead, which doesn't depend on any URL parameter at all.

  // Searches the Page's conversations (paginated) for the one whose
  // non-page participant's name best matches `search` — scores every
  // conversation and picks the single best-scoring match rather than
  // stopping at the first one to clear the loose-match bar, since a common
  // shared word (a middle name like "Jean") can otherwise false-match an
  // unrelated conversation before the real one is even reached. Capped at
  // OT_PSID_SEARCH_MAX_PAGES pages as a safety net for very large inboxes —
  // kept generous since the whole point is to search the FULL conversation
  // list for the real match, not bail out after a token slice of it.
  const OT_PSID_SEARCH_MAX_PAGES = 150; // ~15,000 conversations
  async function otFindConversationByParticipantName(pageId, token, search, onProgress) {
    let url = `https://graph.facebook.com/v19.0/${pageId}/conversations?fields=participants&limit=100&access_token=${encodeURIComponent(token)}`;
    let pages = 0;
    let checked = 0;
    let best = null; // { participant, score }
    let bestTie = false;
    while (url && pages < OT_PSID_SEARCH_MAX_PAGES) {
      const data = await otFetchJsonWithRetry(url);
      if (onProgress) onProgress(checked);
      for (const convo of data.data || []) {
        const participant = (convo.participants?.data || []).find(p => p.id !== pageId);
        checked++;
        if (!participant) continue;
        const score = otNameMatchScore(search, participant.name);
        if (score < OT_NAME_MATCH_MIN_SCORE) continue;
        if (score === 1 && participant.name.trim().toLowerCase() === search.trim().toLowerCase()) {
          return { participant, checked }; // exact name match — no need to keep scanning
        }
        if (!best || score > best.score) {
          best = { participant, score };
          bestTie = false;
        } else if (score === best.score && participant.id !== best.participant.id) {
          bestTie = true;
        }
      }
      url = data.paging?.next || null;
      pages++;
    }
    if (best && !bestTie) return { participant: best.participant, checked };
    if (best && bestTie) return { participant: null, checked, ambiguous: true };
    return { participant: null, checked };
  }

    // Column H is a structured running tally, not free-form notes: a section

    // followed by blanks on the rest of the merge — collapsing consecutive
    // duplicates and dropping blanks handles both shapes the same way,
    // reducing the column to one flat sequence of meaningful tokens.
    function otParseColumnHSections(colHValues) {
      const tokens = [];
      let prev = null;
      colHValues.forEach(raw => {
        const v = (raw || '').toString().trim();
        if (!v) { prev = null; return; }
        if (v === prev) return; // collapse repeated merged-cell value
        tokens.push(v);
        prev = v;
      });

      const isNumber = t => /^\d+$/.test(t);
      const sections = [];
      let current = null;
      let i = 0;
      while (i < tokens.length) {
        const t = tokens[i];
        // "<label> <number> order(s)" — a new section header + its total.
        // The literal word pluralizes with the count ("1 order" vs "96
        // orders"), confirmed in practice — a strict "orders" match was
        // silently dropping every total-of-1 section (and everything under
        // it, since no section was open yet to collect those name/count
        // pairs into).
        if (!isNumber(t) && tokens[i + 1] && isNumber(tokens[i + 1]) && /^orders?$/i.test(tokens[i + 2] || '')) {
          current = { label: t, total: Number(tokens[i + 1]), counts: new Map() };
          sections.push(current);
          i += 3;
          continue;
        }
        // "<name> <number>" — one agent's count within the current section.
        if (current && !isNumber(t) && tokens[i + 1] && isNumber(tokens[i + 1])) {
          current.counts.set(t, (current.counts.get(t) || 0) + Number(tokens[i + 1]));
          i += 2;
          continue;
        }
        i++; // unrecognized token (stray note, etc.) — skip
      }

      // A fresh header for the same label each day/cutoff should replace,
      // not accumulate with, the previous one under that label.
      const latestByLabel = new Map();
      sections.forEach(s => latestByLabel.set(s.label, s));
      return [...latestByLabel.values()];
    }

    // Deterministic per-name color, not random — the same "Assisted by" name
    // must land on the same color every render/reload so it stays a usable
    // visual identifier instead of shuffling around. A fixed hue palette
    // (not raw hash-to-hue) keeps colors visually distinct from each other
    // at a glance, which a naive hash-mod-360 doesn't reliably guarantee for
    // a small handful of names.
    const NAME_COLOR_PALETTE = ['#ff6b35', '#4ade80', '#60a5fa', '#f472b6', '#facc15', '#a78bfa', '#2dd4bf', '#fb923c', '#e879f9', '#38bdf8'];
    function otColorForName(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      return NAME_COLOR_PALETTE[hash % NAME_COLOR_PALETTE.length];
    }

    function renderColHSummary(colHValues, colHHeader) {

  // ─── Sales (New orders archive I:M + Airtable Total) ────────────────────
  // Columns I (Encoded Name) through M (Date Encoded) on the "New orders"
  // tab are the archive of past orders — used here for the per-date order
  // count. (Was H:L until a column was inserted at H.) The archive's own
  // "DP" column (J) is a downpayment, not the full order value, so the
  // actual value comes from Airtable's Total field
  // instead, matched to the archive row by client name.

  function otNormalizeNameForMatch(name) {
    return otStripBidiMarks(name || '').replace(/\s+/g, ' ').trim().toLowerCase();
  }

  // Standard Levenshtein edit distance — used as a typo-tolerant fallback
  // when a Sales archive name doesn't exactly match any Airtable FB Name
  // (e.g. "Jaby JA" vs "Jabby VA", "Shiela" vs "Sheila").
  function otLevenshteinDistance(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const row = [i];
      for (let j = 1; j <= n; j++) {
        row[j] = a[i - 1] === b[j - 1]
          ? prev[j - 1]
          : 1 + Math.min(prev[j - 1], prev[j], row[j - 1]);
      }
      prev = row;
    }
    return prev[n];
  }

  // Fuzzy-match tolerances for the Sales card's name-matching fallback: max
  // edit distance for the name, and max days between the archive's Date
  // Encoded and the candidate Airtable record's creation date. Both must be
  // satisfied together, so two different clients with similar names on
  // unrelated dates don't get mismatched.
  const FUZZY_MAX_NAME_DIST = 3;
  const FUZZY_MAX_DATE_DIFF_DAYS = 5;

  // The "Date Encoded" column mixes formats over time — "2026-06-27" for
  // older rows, "06/29/2026" (M/D/YYYY) for newer ones. Normalize both to
  // YYYY-MM-DD so grouping and chronological sorting both work correctly.
  function otNormalizeDateEncoded(raw) {
    const s = (raw || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) {
      const [, mo, d, y] = m;
      return `${y}-${mo.padStart(2, '0')}-${d.padStart(2, '0')}`;
    }
    return s || null;
  }

      </div>
      <div class="tool-desc">Order counts + DP received from the "New orders" archive (columns H–L), order value from Airtable's Total field, matched by client name. "Refresh" only re-fetches the last 7 days (fast) and reuses cached older data — use "Refresh all data" to fully resync everything.</div>
      <div class="status-line" data-el="status"></div>
      <div class="proof-summary" data-el="summary"></div>
      <div class="no-wrap"><table class="no-table" data-el="table"></table></div>

      <div class="ot-divider" style="margin:14px 0;"></div>
      <div class="tool-name" style="font-size:12px; margin-bottom:8px;">📊 Averages</div>
      <div class="no-wrap"><table class="no-table" data-el="avgTable"></table></div>

      <div class="config-toggle" data-act="toggleConfig">⚙ set api keys</div>
      <div class="config-panel" data-el="configPanel">
        <div class="config-hint">
          Uses the same Google Sheets API key (New Orders card) and Airtable API key (Order Tracker card). Stored locally in this browser only.
        </div>
      </div>
    `;

    const el = sel => card.querySelector(`[data-el="${sel}"]`);
    const statusEl = el('status');
    const summaryEl = el('summary');
    const tableEl = el('table');
    const avgTableEl = el('avgTable');
    const configPanel = el('configPanel');

    function setStatus(text, cls) {
      statusEl.className = `status-line ${cls || ''}`;
      statusEl.innerHTML = text ? `<span class="status-dot ${cls || ''}"></span>${text}` : '';
    }

    const peso = n => `₱${(n || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;

    function renderRows(rows) {
      if (rows.length === 0) {
        tableEl.innerHTML = '';
        return;
      }
      tableEl.innerHTML = `
        <thead><tr>
          <th>Date</th><th>Orders</th><th>Total value</th><th>Total DP</th><th>AOV</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td class="no-name">${r.date}</td>
              <td class="no-num">${r.orders}</td>
              <td class="no-num">${peso(r.totalValue)}</td>
              <td class="no-num">${peso(r.dpReceived)}</td>
              <td class="no-num">${peso(r.aov)}</td>
            </tr>
          `).join('')}
        </tbody>
      `;
    }

    function renderAverages(bases) {
      avgTableEl.innerHTML = `
        <thead><tr>
          <th>Basis</th><th>Orders</th><th>Daily</th><th>Total value</th><th>Total DP</th><th>AOV</th>
        </tr></thead>
        <tbody>
          ${bases.map(b => `
            <tr>
              <td class="no-name">${b.label}</td>
              <td class="no-num">${b.orders.toFixed(1)}</td>
              <td class="no-num">${b.avgDailyOrders.toFixed(1)}</td>
              <td class="no-num">${peso(b.totalValue)}</td>
              <td class="no-num">${peso(b.dpReceived)}</td>
              <td class="no-num">${peso(b.aov)}</td>
            </tr>
          `).join('')}
        </tbody>
      `;
    }

    // Full-history recomputation is the slow part of this card (matching
    // clusters requires Airtable data going back as far as the archive
    // does), and that history only grows over time. So: cache the final
    // per-date rows in localStorage, and on a normal "Refresh" only
    // re-fetch/recompute the last SALES_QUICK_REFRESH_DAYS days — cheap,
    // since it's a small Airtable creation-date-filtered fetch instead of
    // the entire table — then merge with everything older from cache
    // (which doesn't change once archived, so re-fetching it every time
    // was pure waste). "Refresh all data" bypasses the cache entirely and
    // recomputes everything, for whenever older data needs correcting.
    const SALES_CACHE_STORAGE = 'mh_sales_rows_cache_v1';
    const SALES_QUICK_REFRESH_DAYS = 7;
    // Extra lookback on top of the 7-day window when fetching Airtable
    // records for a quick refresh — generous relative to the clustering
    // window (3 days) and fuzzy-match window (5 days) above, so a parent
    // record just outside the 7-day cutoff is still included when its
    // child (or a fuzzy-matched sibling) falls inside it. Not a hard
    // guarantee for the rare record even older than this, which is exactly
    // what "Refresh all data" exists to fully correct.
    const SALES_AIRTABLE_LOOKBACK_BUFFER_DAYS = 21;

    function dateKeyDaysAgo(days) {
      const d = new Date();
      d.setDate(d.getDate() - days);
      return d.toISOString().slice(0, 10);
    }

    function loadSalesCache() {
      try {
        const raw = localStorage.getItem(SALES_CACHE_STORAGE);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }
    function saveSalesCache(rows) {
      try { localStorage.setItem(SALES_CACHE_STORAGE, JSON.stringify({ rows, cachedAt: Date.now() })); } catch { /* storage full/unavailable — cache is best-effort */ }
    }

    async function fetchArchiveRows(googleKey) {
      // Was H2:L2000 (Encoded Name/DP/Payment/Notes/Date Encoded) — a column
      // was inserted at H (a date-labeled tally/notes column), shifting that
      // 5-column block one to the right.
      const range = encodeURIComponent(`${GOOGLE_SHEET_TAB}!I2:M2000`);
      const sheetResp = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${GOOGLE_SHEET_ID}/values/${range}?key=${encodeURIComponent(googleKey)}`);
      const sheetData = await sheetResp.json();
      if (!sheetResp.ok) throw new Error(sheetData.error?.message || `HTTP ${sheetResp.status}`);
      return (sheetData.values || [])
        .map(row => ({ name: row[0] || '', dp: Number(row[1]) || 0, dateEncoded: otNormalizeDateEncoded(row[4]) }))
        .filter(r => r.name && r.dateEncoded);
    }

    async function fetchAirtableForSales(airtableKey, sinceDateKey) {
      const filter = sinceDateKey ? `IS_AFTER(CREATED_TIME(), DATETIME_PARSE("${sinceDateKey}"))` : null;
      const invRecords = await otFetchRecords(airtableKey, INV_TABLE, PROOF_FB_NAME, INV_GRAND_TOTAL, INV_GRAND_TOTAL, filter, []);
      // Standalone souvenir orders (no linked Invitation) have no Invitation
      // record at all, so they'd otherwise be invisible here — Invitation's
      // "Total" field already folds in souvenirs that ARE linked, so only
      // unlinked ones need adding separately to avoid double-counting.
      const souRecords = await otFetchRecords(airtableKey, SOU_TABLE, SOU_FB_NAME, SOU_TOTAL, SOU_TOTAL, filter, [SOU_INV_LINK]);
      const souStandalone = souRecords.filter(rec => !(rec.fields?.[SOU_INV_LINK] || []).length);
      return { invRecords, souStandalone };
    }

    // Turns a set of archive rows + Airtable records into per-date rows.
    // Pure function of its inputs — used by both the quick (date-limited)
    // and full refresh paths.
    function computeSalesRows(archiveRows, invRecords, souStandalone) {
      // Cluster each name's Airtable records into "orders" by creation-date
      // proximity (within 3 days of each other), summing totals within a
      // cluster — this is what actually handles "additional order" child
      // records correctly: their own Total is 0 (real value already rolled
      // into the parent via Airtable's rollup), but the child isn't always
      // created the same day as the parent (confirmed case: parent created
      // Aug 3, its child created Aug 5 — an exact-same-day match caught
      // only the ₱0 child and completely missed the ₱7,275 parent). A
      // 3-day window catches that lag while still keeping a repeat
      // client's old, never-archived order in its own separate cluster
      // (confirmed case: a year-old ₱2,475 order must never combine with
      // an unrelated new order).
      const CLUSTER_WINDOW_MS = 3 * 24 * 3600 * 1000;
      const recordsByName = new Map();
      const addRecord = (nameRaw, totalRaw, createdTime) => {
        const name = otNormalizeNameForMatch(nameRaw);
        if (!name || !createdTime) return;
        if (!recordsByName.has(name)) recordsByName.set(name, []);
        recordsByName.get(name).push({ total: Number(totalRaw) || 0, time: new Date(createdTime).getTime() });
      };
      invRecords.forEach(rec => addRecord(rec.fields?.[PROOF_FB_NAME], rec.fields?.[INV_GRAND_TOTAL], rec.createdTime));
      souStandalone.forEach(rec => addRecord(rec.fields?.[SOU_FB_NAME], rec.fields?.[SOU_TOTAL], rec.createdTime));

      const clustersByName = new Map();
      recordsByName.forEach((records, name) => {
        records.sort((a, b) => a.time - b.time);
        const clusters = [];
        let current = null;
        records.forEach(r => {
          if (current && (r.time - current.lastTime) <= CLUSTER_WINDOW_MS) {
            current.total += r.total;
            current.lastTime = r.time;
          } else {
            current = { total: r.total, lastTime: r.time };
            clusters.push(current);
          }
        });
        clustersByName.set(name, clusters);
      });

      const byDate = new Map();
      let unmatched = 0;
      archiveRows.forEach(r => {
        const key = r.dateEncoded;
        if (!byDate.has(key)) byDate.set(key, { orders: 0, totalValue: 0, dpReceived: 0 });
        const bucket = byDate.get(key);
        bucket.orders++;
        bucket.dpReceived += r.dp;
        const exactClusters = clustersByName.get(otNormalizeNameForMatch(r.name));
        if (exactClusters && exactClusters.length) {
          const archiveTime = new Date(r.dateEncoded).getTime();
          let bestIdx = 0, bestDiff = Infinity;
          exactClusters.forEach((c, idx) => {
            const diff = Math.abs(c.lastTime - archiveTime);
            if (diff < bestDiff) { bestDiff = diff; bestIdx = idx; }
          });
          bucket.totalValue += exactClusters.splice(bestIdx, 1)[0].total;
          return;
        }
        // No exact name match — fall back to fuzzy matching (small typos
        // like "Jaby JA" vs "Jabby VA", "Shiela" vs "Sheila"), but only
        // accept a candidate whose name is close AND whose order date is
        // close, so two different clients with similar names on unrelated
        // dates don't get mismatched.
        const archiveTime = new Date(r.dateEncoded).getTime();
        const archiveName = otNormalizeNameForMatch(r.name);
        let best = null;
        clustersByName.forEach((clusters, candidateName) => {
          if (!clusters.length) return;
          const nameDist = otLevenshteinDistance(archiveName, candidateName);
          if (nameDist > FUZZY_MAX_NAME_DIST) return;
          clusters.forEach((c, idx) => {
            const dateDiffDays = Math.abs(c.lastTime - archiveTime) / 86400000;
            if (dateDiffDays > FUZZY_MAX_DATE_DIFF_DAYS) return;
            if (!best || nameDist < best.nameDist || (nameDist === best.nameDist && dateDiffDays < best.dateDiffDays)) {
              best = { candidateName, idx, nameDist, dateDiffDays, total: c.total };
            }
          });
        });
        if (best) {
          clustersByName.get(best.candidateName).splice(best.idx, 1);
          bucket.totalValue += best.total;
        } else {
          unmatched++;
        }
      });

      const rows = [...byDate.entries()]
        .map(([date, v]) => ({ date, orders: v.orders, totalValue: v.totalValue, dpReceived: v.dpReceived, aov: v.orders ? v.totalValue / v.orders : 0 }))
        .sort((a, b) => b.date.localeCompare(a.date));
      return { rows, unmatched };
    }

    function renderSalesRows(rows, note) {
      const totalOrders = rows.reduce((sum, r) => sum + r.orders, 0);
      summaryEl.textContent = `${totalOrders} archived order(s) across ${rows.length} date(s)${note || ''}`;
      renderRows(rows);
      renderAverages(computeAverageBases(rows));
    }

    function getKeys() {
      const googleKey = localStorage.getItem(GOOGLE_API_KEY_STORAGE) || '';
      const airtableKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      if (!googleKey || !airtableKey) {
        setStatus('Set Google Sheets API key (New Orders card) and Airtable API key (Order Tracker card) first', 'error');
        return null;
      }
      return { googleKey, airtableKey };
    }

    async function load() {
      const keys = getKeys();
      if (!keys) return;
      const cached = loadSalesCache();
      if (cached?.rows?.length) renderSalesRows(cached.rows, ' (cached, refreshing last 7 days...)');
      setStatus(cached ? 'Refreshing last 7 days...' : 'Loading...', '');
      try {
        const archiveRowsAll = await fetchArchiveRows(keys.googleKey);
        if (!cached) {
          // Nothing cached yet — no choice but a full fetch this once.
          const { invRecords, souStandalone } = await fetchAirtableForSales(keys.airtableKey, null);
          const { rows, unmatched } = computeSalesRows(archiveRowsAll, invRecords, souStandalone);
          saveSalesCache(rows);
          renderSalesRows(rows, unmatched ? ` · ${unmatched} unmatched to Airtable` : '');
          setStatus('Loaded ✓', 'success');
          return;
        }
        const cutoffKey = dateKeyDaysAgo(SALES_QUICK_REFRESH_DAYS);
        const sinceKey = dateKeyDaysAgo(SALES_QUICK_REFRESH_DAYS + SALES_AIRTABLE_LOOKBACK_BUFFER_DAYS);
        const recentArchiveRows = archiveRowsAll.filter(r => r.dateEncoded >= cutoffKey);
        const { invRecords, souStandalone } = await fetchAirtableForSales(keys.airtableKey, sinceKey);
        const { rows: freshRows, unmatched } = computeSalesRows(recentArchiveRows, invRecords, souStandalone);
        const merged = [
          ...cached.rows.filter(r => r.date < cutoffKey),
          ...freshRows,
        ].sort((a, b) => b.date.localeCompare(a.date));
        saveSalesCache(merged);
        renderSalesRows(merged, unmatched ? ` · ${unmatched} unmatched to Airtable (last 7 days)` : '');
        setStatus('Loaded ✓', 'success');
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    async function refreshAllData() {
      const keys = getKeys();
      if (!keys) return;
      setStatus('Refreshing all data — this can take a while...', '');
      try {
        const archiveRowsAll = await fetchArchiveRows(keys.googleKey);
        const { invRecords, souStandalone } = await fetchAirtableForSales(keys.airtableKey, null);
        const { rows, unmatched } = computeSalesRows(archiveRowsAll, invRecords, souStandalone);
        saveSalesCache(rows);
        renderSalesRows(rows, unmatched ? ` · ${unmatched} unmatched to Airtable` : '');
        setStatus('All data refreshed ✓', 'success');
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    function computeAverageBases(rows) {
      const sumRange = list => list.reduce((acc, r) => ({
        orders: acc.orders + r.orders,
        totalValue: acc.totalValue + r.totalValue,
        dpReceived: acc.dpReceived + r.dpReceived,
      }), { orders: 0, totalValue: 0, dpReceived: 0 });

      const withAov = s => ({ ...s, aov: s.orders ? s.totalValue / s.orders : 0 });
      const scale = (s, factor) => withAov({ orders: s.orders * factor, totalValue: s.totalValue * factor, dpReceived: s.dpReceived * factor });

      const today = new Date();
      const currentMonthKey = today.toISOString().slice(0, 7);
      const todayKey = today.toISOString().slice(0, 10);
      // Today isn't a finished day yet — including its (partial) orders
      // would understate every daily average, so exclude it from both the
      // sums and the day-count divisors below.
      const historicalRows = rows.filter(r => r.date !== todayKey);
      const completedDaysInMonth = Math.max(0, today.getDate() - 1);

      const currentMonthRows = historicalRows.filter(r => r.date.startsWith(currentMonthKey));
      const currentMonthSum = sumRange(currentMonthRows);

      const thirtyDaysAgo = new Date(today);
      thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
      const thirtyDaysAgoKey = thirtyDaysAgo.toISOString().slice(0, 10);
      const last30Rows = historicalRows.filter(r => r.date >= thirtyDaysAgoKey);
      const last30Sum = sumRange(last30Rows);

      const allSum = sumRange(historicalRows);
      const dates = historicalRows.map(r => r.date).sort();
      let spanDays = 1;
      if (dates.length > 1) {
        const first = new Date(dates[0]);
        const last = new Date(dates[dates.length - 1]);
        spanDays = Math.max(1, Math.round((last - first) / 86400000) + 1);
      }

      const currentMonthAvgDaily = completedDaysInMonth ? currentMonthSum.orders / completedDaysInMonth : 0;
      const last30AvgDaily = last30Sum.orders / 30;
      const allDataAvgDaily = allSum.orders / spanDays;

      return [
        { label: 'Current month', ...withAov(currentMonthSum), avgDailyOrders: currentMonthAvgDaily },
        { label: '30-day estimate (current month)', ...scale(currentMonthSum, completedDaysInMonth ? 30 / completedDaysInMonth : 0), avgDailyOrders: currentMonthAvgDaily },
        { label: 'Last 30 days', ...withAov(last30Sum), avgDailyOrders: last30AvgDaily },
        { label: 'All data total', ...withAov(allSum), avgDailyOrders: allDataAvgDaily },
        { label: '30-day estimate (all data)', ...scale(allSum, 30 / spanDays), avgDailyOrders: allDataAvgDaily },
      ];
    }

    card.addEventListener('click', (e) => {
      const act = e.target.dataset.act;
      if (act === 'load') load();
      else if (act === 'refreshAll') refreshAllData();
      else if (act === 'toggleConfig') configPanel.classList.toggle('open');
    });

    load();

    return card;
  }

  // ─── Inventory ───────────────────────────────────────────────────────────
  // Invitation records with "Envelope in stock" unchecked — lets you mark
  // one in stock (checks the field) directly from here once envelopes for
  // that order arrive.

  function buildInventoryCard() {
    const card = document.createElement('div');
    card.className = 'tool-card';
    card.style.gridColumn = 'span 2';
    card.innerHTML = `
      <div class="tool-hd">
        <div class="tool-name">📥 Inventory</div>
        <div class="tool-actions">
          <button class="icon-btn" data-act="scan">▶ Scan</button>
        </div>
      </div>
      <div class="tool-desc">Orders with Envelope in stock unchecked.</div>
      <div class="status-line" data-el="status"></div>
      <div class="proof-summary" data-el="summary"></div>
      <div style="display:flex; gap:14px; margin:2px 0 10px;">
        <button class="icon-btn" data-act="genList">📋 Colored envelope list</button>
        <button class="icon-btn" data-act="markAllOrdered" style="color:#4ade80;">✅ Colored envelope ordered</button>
      </div>
      <div class="no-wrap" data-el="listWrap" style="display:none; margin-bottom:12px;">
        <div style="white-space:pre-wrap; font-size:11px; color:#ccc; background:#111; border-radius:6px; padding:10px; font-family:'DM Mono',monospace; max-height:260px; overflow-y:auto;" data-el="listText"></div>
        <button class="icon-btn" data-act="copyList" style="margin-top:6px;">📄 Copy list</button>
      </div>
      <div class="no-wrap"><table class="no-table" data-el="table"></table></div>
    `;

    const el = sel => card.querySelector(`[data-el="${sel}"]`);
    const statusEl = el('status');
    const summaryEl = el('summary');
    const tableEl = el('table');
    const listWrapEl = el('listWrap');
    const listTextEl = el('listText');

    let lastFlagged = [];

    function setStatus(text, cls) {
      statusEl.className = `status-line ${cls || ''}`;
      statusEl.innerHTML = text ? `<span class="status-dot ${cls || ''}"></span>${text}` : '';
    }

    function renderResults(items) {
      if (items.length === 0) {
        tableEl.innerHTML = '';
        return;
      }
      tableEl.innerHTML = `
        <thead><tr>
          <th>#</th><th>FB Name</th><th>Link</th><th>Status</th><th>Type</th><th>Total sets</th><th>Size</th><th>Color</th><th>Envelope</th>
        </tr></thead>
        <tbody>
          ${items.map(it => `
            <tr>
              <td class="no-num">${it.clientNum ?? ''}</td>
              <td class="no-name"><a class="proof-link" style="margin:0; color:#fff; font-weight:600;" href="https://airtable.com/${OT_BASE_ID}/${INV_TABLE}/${it.id}" target="_blank" rel="noopener" title="${(it.breakdown || '').replace(/"/g, '&quot;')}">${it.name}</a></td>
              <td>${it.metaLink ? `<a class="proof-link" href="${it.metaLink}" target="_blank" rel="noopener">Open ↗</a>` : ''}</td>
              <td><span class="inv-status-chip">${it.status || ''}</span></td>
              <td>${it.type || ''}</td>
              <td class="no-num">${it.totalSets ?? ''}</td>
              <td>${it.size || ''}</td>
              <td>${it.color || ''}</td>
              <td class="no-check"><input type="checkbox" data-id="${it.id}" /></td>
            </tr>
          `).join('')}
        </tbody>
      `;
    }

    async function scan() {
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      if (!apiKey) {
        setStatus('Set Airtable API key in Order Tracker first ↓', 'error');
        return;
      }
      setStatus('Scanning...', '');
      summaryEl.textContent = '';
      tableEl.innerHTML = '';
      try {
        // Scoped to the "Inventory" view (whatever other filters it has)
        // AND explicitly excludes records where Envelope in stock is
        // checked, AND excludes any "On hold ..." or "Pending ..." status
        // (On hold production/shipping/layout, Pending details, etc. —
        // FIND() catches all variants of each).
        const records = await otFetchRecords(
          apiKey, INV_TABLE, INV_STATUS, INV_TOTAL_SETS, INV_TYPE,
          `AND(NOT({Envelope in stock}), FIND("On hold", {Status})=0, FIND("Pending", {Status})=0)`,
          [PROOF_FB_NAME, PROOF_CLIENT_NUM, META_LINK, INV_BREAKDOWN, INV_SIZE, INV_COLOR],
          INVENTORY_VIEW_ID,
          (count) => setStatus(`Scanning... ${count} loaded`, '')
        );

        const items = records.map(r => {
          const colorList = Array.isArray(r.fields?.[INV_COLOR]) ? r.fields[INV_COLOR] : (r.fields?.[INV_COLOR] ? [r.fields[INV_COLOR]] : []);
          return {
            id: r.id,
            name: r.fields?.[PROOF_FB_NAME] || 'Unnamed',
            clientNum: r.fields?.[PROOF_CLIENT_NUM],
            metaLink: r.fields?.[META_LINK],
            breakdown: r.fields?.[INV_BREAKDOWN],
            status: r.fields?.[INV_STATUS],
            type: r.fields?.[INV_TYPE],
            totalSets: r.fields?.[INV_TOTAL_SETS],
            size: r.fields?.[INV_SIZE],
            colorList,
            color: colorList.join(', '),
          };
        });

        lastFlagged = items;
        summaryEl.textContent = `${items.length} order(s) with envelope not in stock`;
        setStatus(items.length ? `${items.length} flagged` : 'All good ✓', items.length ? 'error' : 'success');
        listWrapEl.style.display = 'none';
        renderResults(items);
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      }
    }

    // Colored-envelope order list: combines every flagged order needing one
    // of the "colored" envelope types into "<qty> pcs <size> <color/label>"
    // lines, merging identical size+color/label combos into a single total
    // so it can go straight to the envelope supplier as one order.
    const COLORED_ENVELOPE_TYPES = ['Colored', 'Premium Colored', 'Portrait Colored', 'Premium Portrait Colored', 'Transparent'];

    function generateEnvelopeList() {
      const relevant = lastFlagged.filter(it => COLORED_ENVELOPE_TYPES.includes(it.type));
      if (relevant.length === 0) {
        listTextEl.textContent = 'No colored-envelope orders in the current list.';
        listWrapEl.style.display = 'block';
        return;
      }
      const groups = new Map();
      relevant.forEach(it => {
        const label = it.colorList.length ? it.colorList.join(' ') : (it.type || '');
        const key = `${it.size || ''}|${label}`;
        const qty = Number(it.totalSets) || 0;
        if (!groups.has(key)) groups.set(key, { size: it.size || '', label, qty: 0 });
        groups.get(key).qty += qty;
      });
      const lines = [...groups.values()]
        .filter(g => g.qty > 0)
        .sort((a, b) => b.qty - a.qty)
        .map(g => `${g.qty} pcs ${g.size} ${g.label}`.trim());
      listTextEl.textContent = lines.join('\n');
      listWrapEl.style.display = 'block';
    }

    async function markAllOrdered() {
      const apiKey = localStorage.getItem(OT_KEY_STORAGE) || '';
      if (!apiKey) {
        setStatus('Set Airtable API key in Order Tracker first ↓', 'error');
        return;
      }
      // Only the colored/transparent-envelope subset — same records the
      // list button generates the order for, not every flagged record
      // (confirmed bug: this was marking ALL flagged types as ordered,
      // including ones with no colored envelope on order at all).
      const relevant = lastFlagged.filter(it => COLORED_ENVELOPE_TYPES.includes(it.type));
      if (relevant.length === 0) return;

  // ─── Ads (Meta Graph API — ad account insights) ─────────────────────────
  // Pulls spend/results straight from the Facebook Marketing API for a given
  // ad account. Needs a user access token with ads_read permission (a
  // long-lived token from the Graph API Explorer / a system user works).

  const ADS_TOKEN_STORAGE = 'mh_ads_meta_access_token';
  const ADS_ACCOUNT_STORAGE = 'mh_ads_meta_account_id';
  const ADS_GRAPH_VERSION = 'v21.0';

  // Same range as the Sales card's daily table (a rolling window of dates,
  // newest first) so the two cards line up day-for-day.
  const ADS_DATE_PRESET = 'last_30d';

  const ADS_MESSAGE_ACTION_TYPES = ['onsite_conversion.messaging_conversation_started_7d'];
  const ADS_PURCHASE_ACTION_TYPES = ['omni_purchase', 'purchase', 'offsite_conversion.fb_pixel_purchase'];

  async function adsFetchDailyInsights(token, accountId) {
    const acct = accountId.trim().replace(/^act_/, '');
    const fields = 'spend,reach,actions';
    // Facebook's default page size for a daily-broken-down last_30d query is
    // smaller than 30 rows and returns oldest-first, so reading only the
    // first page silently cut off the most recent days (confirmed: a 30-day
    // window was only showing up through day ~25). Follow pagination fully.
    let url = `https://graph.facebook.com/${ADS_GRAPH_VERSION}/act_${encodeURIComponent(acct)}/insights?fields=${fields}&date_preset=${ADS_DATE_PRESET}&time_increment=1&limit=100&access_token=${encodeURIComponent(token)}`;
    const rows = [];
    let pages = 0;
    while (url && pages < 10) {
      const resp = await fetch(url);
      const json = await resp.json();
      if (json.error) throw new Error(json.error.message || 'Graph API error');
      rows.push(...(json.data || []));
      url = json.paging?.next || null;
      pages++;
    }
    return rows;
  }

  function adsCountActions(row, actionTypes) {
    if (!row || !Array.isArray(row.actions)) return 0;
    return row.actions
      .filter(a => actionTypes.includes(a.action_type))
      .reduce((sum, a) => sum + (Number(a.value) || 0), 0);
  }

  function adsCostPer(spend, count) {
    return count > 0 ? spend / count : 0;
  }

    function renderAverages(bases) {
      avgTableEl.innerHTML = `

          <th>Basis</th><th>Spend</th><th>Messages</th><th>Cost/message</th><th>Purchases</th><th>Cost/purchase</th><th>Reach</th><th>Cost/reach</th>

    // last_30d already caps the fetched window, so "all data" and "last 30
    // days" would be identical here — only Current month and its 30-day
    // run-rate estimate add anything beyond the raw last-30-days total.
    function computeAverageBases(rows) {
      const sumRange = list => list.reduce((acc, r) => ({
        spend: acc.spend + r.spend,
        messages: acc.messages + r.messages,
        purchases: acc.purchases + r.purchases,
        reach: acc.reach + r.reach,
      }), { spend: 0, messages: 0, purchases: 0, reach: 0 });

      const withCosts = s => ({
        ...s,
        costPerMessage: adsCostPer(s.spend, s.messages),
        costPerPurchase: adsCostPer(s.spend, s.purchases),
        costPerReach: adsCostPer(s.spend, s.reach),
      });
      const scale = (s, factor) => withCosts({
        spend: s.spend * factor, messages: s.messages * factor,
        purchases: s.purchases * factor, reach: s.reach * factor,
      });

      const today = new Date();
      const currentMonthKey = today.toISOString().slice(0, 7);
      const todayKey = today.toISOString().slice(0, 10);
      // Today isn't a finished day yet — exclude it from sums and from the
      // day-count divisor used to project a full-month/30-day estimate.
      const historicalRows = rows.filter(r => r.date !== todayKey);
      const completedDaysInMonth = Math.max(0, today.getDate() - 1);

      const currentMonthRows = historicalRows.filter(r => r.date.startsWith(currentMonthKey));
      const currentMonthSum = sumRange(currentMonthRows);
      const last30Sum = sumRange(historicalRows);

      return [
        { label: 'Current month', ...withCosts(currentMonthSum) },
        { label: '30-day estimate (current month)', ...scale(currentMonthSum, completedDaysInMonth ? 30 / completedDaysInMonth : 0) },
        { label: 'Last 30 days', ...withCosts(last30Sum) },
      ];
    }

  // personal task list, but worth knowing before this gets heavy daily use.

  const TASKS_REPO_OWNER = 'mhcreatives';
  const TASKS_REPO_NAME = 'mh-dashboard';
  const TASKS_DATA_PATH = 'tasks-data.json';
  const TASKS_GITHUB_TOKEN_STORAGE = 'mh_tasks_github_token';

  function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    bytes.forEach(b => { binary += String.fromCharCode(b); });
    return btoa(binary);
  }
  function base64ToUtf8(b64) {
    const binary = atob(b64.replace(/\n/g, ''));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder().decode(bytes);
  }
  function tasksNewId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  let tasksDataCache = { dailyTasks: [], goals: [] };
  let tasksDataSha = null; // null = file doesn't exist in the repo yet

  async function ghFetchTasksData(token) {
    const url = `https://api.github.com/repos/${TASKS_REPO_OWNER}/${TASKS_REPO_NAME}/contents/${TASKS_DATA_PATH}`;
    const resp = await fetch(url, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } });
    if (resp.status === 404) { tasksDataSha = null; return { dailyTasks: [], goals: [] }; }
    const json = await resp.json();
    if (!resp.ok) throw new Error(json.message || `GitHub API error ${resp.status}`);
    tasksDataSha = json.sha;
    try {
      const parsed = JSON.parse(base64ToUtf8(json.content));
      return { dailyTasks: parsed.dailyTasks || [], goals: parsed.goals || [] };
    } catch {
      return { dailyTasks: [], goals: [] };
    }
  }

  async function ghSaveTasksData(token, data) {
    const url = `https://api.github.com/repos/${TASKS_REPO_OWNER}/${TASKS_REPO_NAME}/contents/${TASKS_DATA_PATH}`;
    const doPut = () => {
      const body = { message: 'Update tasks/goals data', content: utf8ToBase64(JSON.stringify(data, null, 2)) };
      if (tasksDataSha) body.sha = tasksDataSha;
      return fetch(url, {
        method: 'PUT',
        headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    };
    let resp = await doPut();
    if (resp.status === 409) {
      // sha is stale (file changed elsewhere since we last loaded it) —
      // refetch to get the current sha, then retry once with our data
      // (last-write-wins; fine for a personal single-user task list).
      await ghFetchTasksData(token);
      resp = await doPut();
    }
    const json = await resp.json();
    if (!resp.ok) throw new Error(json.message || `GitHub API error ${resp.status}`);
    tasksDataSha = json.content.sha;
  }

  let renderDailyTasksList = () => {};
  let renderGoalsList = () => {};

  let setGoalsStatus = () => {};

  // before showing "Saved", instead of assuming success unconditionally
  // (confirmed bug: tasks looked saved but silently failed and vanished on
  // reload, because the status line said "Saved ✓" regardless of outcome).
  async function saveTasksData(onError) {
    const token = localStorage.getItem(TASKS_GITHUB_TOKEN_STORAGE) || '';
    if (!token) { onError?.(new Error('No GitHub token set')); return false; }
    try {
      await ghSaveTasksData(token, tasksDataCache);
